<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">
<script src="/vendor/lucide-mux.js" defer></script>
<script src="/application-nav.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes xterm-256color · TrikeShed</title>
<style>
:root{--bg:#090b10;--panel:#11151e;--line:#293142;--ink:#d8dce6;--dim:#7d879a;--amber:#f2a011;--green:#3ddc84;--red:#ff5964;--cyan:#3fd0ff}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{color:var(--amber)} .badge{border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--dim)}
button{font:inherit;color:var(--ink);background:#171d28;border:1px solid var(--line);border-radius:3px;padding:4px 8px;cursor:pointer} button:hover{border-color:var(--amber);color:var(--amber)}
main{min-height:0;display:grid;grid-template-columns:minmax(500px,1fr) 310px;gap:1px;background:var(--line)}
#terminalPanel{min-width:0;background:#050607;display:flex;flex-direction:column}
#screenWrap{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;align-items:flex-start;justify-content:center}
/* Focus lives here, not on #screen: IME commits, mobile keyboards and dictation only reach a form
   control. It must stay in the layout (not display:none) or it cannot hold focus. */
#kbd{position:absolute;width:1px;height:1px;padding:0;border:0;outline:none;resize:none;opacity:0;left:-9999px;overflow:hidden}
#screen{outline:none;background:#000;color:#d8dce6;padding:5px 6px;box-shadow:0 0 0 1px #222,0 0 28px rgba(63,208,255,.05);font:14px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none;user-select:text;cursor:text}
.termrow{height:1.15em;white-space:pre}.cell{display:inline-block;width:.61em;height:1.15em;overflow:visible;vertical-align:top}
/* The cursor is the panel's own cursor, not a DOM caret: the cell carries no inline colour so these win. */
.cursor{outline:1px solid var(--amber);background:rgba(242,160,17,.28)}
#screen.focused .cursor{background:var(--amber);color:#07090d;animation:caret 1.06s steps(1) infinite}
@keyframes caret{50%{background:rgba(242,160,17,.2);color:var(--ink)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.15}}
#rails{min-height:0;background:var(--panel);display:grid;grid-template-rows:auto 1fr 1fr}
#rails h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0;padding:8px 10px;border-bottom:1px solid var(--line)}
.rail{overflow:auto;border-bottom:1px solid var(--line);padding:5px}.sig{padding:5px 7px;margin:3px 0;border-left:3px solid var(--dim);background:#161b25;font-size:10px;word-break:break-word}.sig.manual{border-color:var(--amber)}.sig.causal{border-color:var(--cyan)}.sig.failed{border-color:var(--red)}.sig .id{color:var(--dim)}.sig .cause{color:var(--cyan)}
.ok{color:var(--green)}.bad{color:var(--red)}
#hint{margin-left:auto;color:var(--dim);font-size:11px}
@media(max-width:900px){main{grid-template-columns:1fr}#rails{display:none}}
@media(prefers-reduced-motion:reduce){.blink,#screen.focused .cursor{animation:none}}
</style>
</head>
<body data-app-page="hermes">
<header><b>HERMES · XTERM-256COLOR</b><span id="state" class="badge">closed</span><span id="geometry" class="badge">–</span><span id="revision" class="badge">rev 0</span><button id="open">boot GraalPy sleeve</button><span id="hint">click the screen and type · ↑ history · Ctrl-C cancel · Ctrl-L clear</span><a href="/graal" style="color:var(--dim);margin-left:12px">Graal console ↗</a></header>
<main>
  <section id="terminalPanel"><div id="screenWrap"><div id="screen" role="application" aria-label="Hermes xterm-256color terminal"></div><textarea id="kbd" aria-label="terminal input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div></section>
  <aside id="rails"><h2>manual ↔ causal LCNC patch panel</h2><div id="manualRail" class="rail"></div><div id="causalRail" class="rail"></div></aside>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let model={rows:24,columns:80,revision:0,cursor:{row:0,column:0,visible:true},lines:[],state:'closed'},lastCursor={row:-1,column:-1},focused=false;
const ANSI16=['#000000','#cd3131','#0dbc79','#e5e510','#2472c8','#bc3fbc','#11a8cd','#e5e5e5','#666666','#f14c4c','#23d18b','#f5f543','#3b8eea','#d670d6','#29b8db','#ffffff'];
function color(index,rgb,fallback){if(rgb!=null)return '#'+Number(rgb).toString(16).padStart(6,'0');if(index<0)return fallback;if(index<16)return ANSI16[index];if(index>=232){const v=8+(index-232)*10;return `rgb(${v},${v},${v})`}const n=index-16,r=Math.floor(n/36),g=Math.floor(n%36/6),b=n%6,f=x=>x?55+x*40:0;return `rgb(${f(r)},${f(g)},${f(b)})`}
function blank(){return{text:' ',continuation:false,fg:-1,bg:-1,bold:false,faint:false,italic:false,underline:false,blink:false,inverse:false,concealed:false,crossedOut:false}}
function normalize(){while(model.lines.length<model.rows)model.lines.push(Array.from({length:model.columns},blank));for(let r=0;r<model.rows;r++){while(model.lines[r].length<model.columns)model.lines[r].push(blank());model.lines[r].length=model.columns}}
function cellSpan(cell,r,c){
  const isCursor=model.cursor.visible&&model.cursor.row===r&&model.cursor.column===c;
  const s=document.createElement('span');
  s.className='cell'+(cell.blink?' blink':'')+(isCursor?' cursor':'');
  let fg=color(cell.fg,cell.fgRgb,'#d8dce6'),bg=color(cell.bg,cell.bgRgb,'#000');
  if(cell.inverse){const t=fg;fg=bg;bg=t}
  // The cursor cell is left to CSS so the caret animation is not fighting an inline background.
  if(!isCursor){s.style.color=cell.concealed?bg:fg;s.style.backgroundColor=bg}
  s.style.fontWeight=cell.bold?'700':'400';s.style.opacity=cell.faint?'.65':'1';s.style.fontStyle=cell.italic?'italic':'normal';
  s.style.textDecoration=[cell.underline?'underline':'',cell.crossedOut?'line-through':''].filter(Boolean).join(' ');
  s.textContent=cell.continuation?'':(cell.text||' ');return s}
function renderRows(rows){normalize();for(const r of rows){if(r<0||r>=model.rows)continue;let line=$('screen').children[r];if(!line){line=document.createElement('div');line.className='termrow';$('screen').appendChild(line)}line.replaceChildren(...model.lines[r].map((c,i)=>cellSpan(c,r,i)))}while($('screen').children.length>model.rows)$('screen').lastChild.remove();$('geometry').textContent=model.columns+'×'+model.rows;$('revision').textContent='rev '+model.revision}
function snapshot(x){const p=x.panel||x;model.state=x.state||model.state;model.rows=p.rows||model.rows;model.columns=p.columns||model.columns;model.revision=p.revision||0;model.cursor=p.cursor||model.cursor;model.lines=p.lines||[];setState(model.state);renderRows(Array.from({length:model.rows},(_,i)=>i));lastCursor={...model.cursor};for(const s of x.signals||[])signal(s)}
function patches(ps){const touched=new Set([lastCursor.row,model.cursor.row]);for(const p of ps||[]){model.revision=Math.max(model.revision,p.revision||0);if(!model.lines[p.y])model.lines[p.y]=Array.from({length:model.columns},blank);for(let i=0;i<(p.cells||[]).length;i++)if(p.x+i<model.columns)model.lines[p.y][p.x+i]=p.cells[i];touched.add(p.y)}renderRows([...touched]);lastCursor={...model.cursor}}
function setState(s){$('state').textContent=s;$('state').className='badge '+(s==='ready'?'ok':s==='failed'?'bad':'')}
function signal(s){if(!s||document.querySelector('[data-signal="'+CSS.escape(s.id)+'"]'))return;const div=document.createElement('div');div.className='sig '+s.lane+(s.kind==='failed'?' failed':'');div.dataset.signal=s.id;const preview=(s.payload||'').replace(/[\x00-\x1f\x7f]/g,' ').slice(0,160);div.innerHTML='<b>'+escapeHtml(s.kind)+'</b> <span class="id">#'+escapeHtml((s.id||'').replace('sha256:','').slice(0,10))+'</span>'+(s.causeSignalId?'<div class="cause">← '+escapeHtml(s.causeSignalId.replace('sha256:','').slice(0,10))+'</div>':'')+'<div>'+escapeHtml(preview)+'</div>';const rail=s.lane==='manual'?$('manualRail'):$('causalRail');rail.prepend(div);while(rail.children.length>100)rail.lastChild.remove()}
function escapeHtml(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

/* ── input ───────────────────────────────────────────────────────────────────
   The server owns the line discipline. This page only ships keystrokes, and it
   ships them strictly in order: two POSTs racing would scramble the line. */
const outbox=[];let pumping=false;
function post(body){outbox.push(body);if(!pumping)pump()}
async function pump(){pumping=true;while(outbox.length){const body=outbox.shift();
  try{await fetch('/api/hermes/terminal/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  catch(e){/* dropped keystroke; the next snapshot reconciles the screen */}}
  pumping=false}
/* Printables coalesce inside one frame so fast typing is a few POSTs, not one per key. */
let pending='';
function sendText(text,paste){if(paste){flush();post({text,paste:true});return}pending+=text;if(pending.length===text.length)queueMicrotask(flush)}
function flush(){if(!pending)return;const text=pending;pending='';post({text})}
function sendKey(key,e){flush();post({key,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey})}
const NAMED={Enter:'ENTER',Backspace:'BACKSPACE',Tab:'TAB',Escape:'ESCAPE',ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',Home:'HOME',End:'END',Insert:'INSERT',Delete:'DELETE',PageUp:'PAGE_UP',PageDown:'PAGE_DOWN'};
const kbd=$('kbd');
let composing=false;
kbd.addEventListener('keydown',e=>{
  if(e.metaKey)return;                                   // leave ⌘C/⌘V to the browser
  if(composing)return;                                   // mid-IME: let the composition finish
  const named=NAMED[e.key]||(/^F([1-9]|1[0-2])$/.test(e.key)?e.key.toUpperCase():null);
  if(named){e.preventDefault();sendKey(named,e);return}
  if(e.ctrlKey&&e.key.length===1){                       // Ctrl-letter folds to its C0 control
    const code=e.key.toLowerCase().charCodeAt(0);
    if(code>=97&&code<=122){e.preventDefault();sendText(String.fromCharCode(code-96))}
    return}
  // Anything else is text: let it land in the textarea and leave through `input`, so a
  // composed glyph, a dictated word and a plain keypress all take one path.
});
kbd.addEventListener('compositionstart',()=>{composing=true});
kbd.addEventListener('compositionend',e=>{composing=false;if(e.data)sendText(e.data);kbd.value=''});
kbd.addEventListener('input',()=>{if(composing)return;const text=kbd.value;kbd.value='';if(text)sendText(text)});
kbd.addEventListener('paste',e=>{e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text');if(text)sendText(text,true)});
// Derive the caret's look from what actually holds focus: a programmatic focus() on load fires no
// focus event, and the cursor would sit hollow while the terminal was in fact taking keys.
function syncFocus(){focused=document.activeElement===kbd;$('screen').classList.toggle('focused',focused)}
kbd.addEventListener('focus',syncFocus);kbd.addEventListener('blur',syncFocus);addEventListener('focus',syncFocus);
// A click anywhere on the screen means "type here" — but never steal a text selection.
$('screen').addEventListener('mouseup',()=>{if((getSelection()||'').toString()==='')kbd.focus()});
$('screen').addEventListener('mousedown',e=>e.preventDefault());

async function load(){try{const r=await fetch('/api/hermes/terminal');snapshot(await r.json())}catch(e){$('state').textContent='offline'}}
async function boot(){await fetch('/api/hermes/terminal/open',{method:'POST'});setState('booting');kbd.focus()}
$('open').onclick=boot;
let resizeTimer;function fitGeometry(){clearTimeout(resizeTimer);resizeTimer=setTimeout(async()=>{const wrap=$('screenWrap').getBoundingClientRect(),probe=document.createElement('span');probe.className='cell';probe.textContent='M';$('screen').appendChild(probe);const box=probe.getBoundingClientRect();probe.remove();const columns=Math.max(20,Math.min(220,Math.floor((wrap.width-32)/(box.width||8.5)))),rows=Math.max(6,Math.min(80,Math.floor((wrap.height-30)/(box.height||16))));if(columns!==model.columns||rows!==model.rows)await fetch('/api/hermes/terminal/resize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({columns,rows})})},250)}addEventListener('resize',fitGeometry);
function connect(){const es=new EventSource('/api/hermes/terminal/events');es.onmessage=e=>{const x=JSON.parse(e.data);if(x.kind==='state'){setState(x.state)}else if(x.kind==='manual')signal(x.signal);else if(x.kind==='causal'){signal(x.signal);if(x.terminal){model.cursor=x.terminal.cursor||model.cursor;model.revision=x.terminal.revision||model.revision;model.columns=x.terminal.columns||model.columns;model.rows=x.terminal.rows||model.rows;if(x.terminal.title)document.title=x.terminal.title}patches(x.patches)}};es.onerror=()=>{es.close();load();setTimeout(connect,1500)}}
load().then(fitGeometry);setInterval(load,10000);connect();kbd.focus();syncFocus();
</script>
</body>
</html>
