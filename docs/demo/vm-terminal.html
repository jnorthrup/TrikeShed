<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VM Terminals · TrikeShed</title>
<style>
:root{--bg:#090b10;--panel:#11151e;--line:#293142;--ink:#d8dce6;--dim:#7d879a;--amber:#f2a011;--green:#3ddc84;--red:#ff5964;--cyan:#3fd0ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}header,#tabs,footer{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}header b{color:var(--amber)}#tabs{overflow:auto;padding:5px 10px}.tab,button,input,select{font:inherit;color:var(--ink);background:#171d28;border:1px solid var(--line);border-radius:3px;padding:4px 8px}.tab{cursor:pointer;white-space:nowrap}.tab.active{border-color:var(--amber);color:var(--amber)}.badge{border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--dim)}main{min-height:0;display:grid;grid-template-columns:minmax(500px,1fr) 300px;gap:1px;background:var(--line)}#screenWrap{background:#050607;overflow:auto;padding:10px;display:flex;align-items:flex-start;justify-content:center}#screen{outline:none;background:#000;padding:5px 6px;box-shadow:0 0 0 1px #222;font:14px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none}.termrow{height:1.15em;white-space:pre}.cell{display:inline-block;width:.61em;height:1.15em;overflow:visible;vertical-align:top}.cursor{outline:1px solid var(--amber);background:rgba(242,160,17,.35)!important}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.15}}#rails{background:var(--panel);display:grid;grid-template-rows:auto 1fr 1fr;min-height:0}#rails h2{font-size:10px;letter-spacing:.1em;color:var(--dim);margin:0;padding:8px;border-bottom:1px solid var(--line)}.rail{overflow:auto;padding:4px;border-bottom:1px solid var(--line)}.sig{font-size:10px;padding:4px 6px;margin:3px 0;border-left:3px solid var(--dim);background:#161b25;word-break:break-word}.sig.manual{border-color:var(--amber)}.sig.causal{border-color:var(--cyan)}.sig.failed{border-color:var(--red)}.cause{color:var(--cyan)}footer{border-top:1px solid var(--line);border-bottom:0}#command{flex:1}.ok{color:var(--green)}.bad{color:var(--red)}a{color:var(--dim)}@media(max-width:850px){main{grid-template-columns:1fr}#rails{display:none}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}
</style></head><body>
<header><b>PROCESS TERMINALS</b><span id="state" class="badge">select a VM</span><span id="geometry" class="badge">–</span><span id="revision" class="badge">rev 0</span><a href="/hermes">Hermes VT220</a><a href="/graal" style="margin-left:auto">Graal console ↗</a></header>
<div id="tabs"></div>
<main><section id="screenWrap"><div id="screen" tabindex="0" role="application" aria-label="Selected VM terminal"></div></section><aside id="rails"><h2>manual ↔ causal LCNC</h2><div id="manualRail" class="rail"></div><div id="causalRail" class="rail"></div></aside></main>
<footer><select id="mode"><option value="eval">eval</option><option value="stdin">stdin</option></select><input id="command" autocomplete="off" spellcheck="false" placeholder="Python/JS expression · :status · :clear"><button id="send">send</button></footer>
<script>
'use strict';const $=id=>document.getElementById(id);let active=new URLSearchParams(location.search).get('id')||'',model={rows:24,columns:80,revision:0,cursor:{row:0,column:0,visible:true},lines:[]},lastCursor={row:-1,column:-1};const C=['#000','#cd3131','#0dbc79','#e5e510','#2472c8','#bc3fbc','#11a8cd','#e5e5e5','#666','#f14c4c','#23d18b','#f5f543','#3b8eea','#d670d6','#29b8db','#fff'];
function col(i,rgb,d){if(rgb!=null)return '#'+Number(rgb).toString(16).padStart(6,'0');if(i<0)return d;if(i<16)return C[i];if(i>=232){const v=8+(i-232)*10;return `rgb(${v},${v},${v})`}const n=i-16,R=Math.floor(n/36),G=Math.floor(n%36/6),B=n%6,f=x=>x?55+x*40:0;return `rgb(${f(R)},${f(G)},${f(B)})`}function blank(){return{text:' ',continuation:false,fg:-1,bg:-1}}function normalize(){while(model.lines.length<model.rows)model.lines.push(Array.from({length:model.columns},blank));for(let r=0;r<model.rows;r++){while(model.lines[r].length<model.columns)model.lines[r].push(blank());model.lines[r].length=model.columns}}
function span(c,r,n){const s=document.createElement('span');s.className='cell'+(c.blink?' blink':'')+(model.cursor.visible&&model.cursor.row===r&&model.cursor.column===n?' cursor':'');let f=col(c.fg,c.fgRgb,'#d8dce6'),b=col(c.bg,c.bgRgb,'#000');if(c.inverse){const t=f;f=b;b=t}s.style.color=c.concealed?b:f;s.style.backgroundColor=b;s.style.fontWeight=c.bold?'700':'400';s.style.opacity=c.faint?'.65':'1';s.style.fontStyle=c.italic?'italic':'normal';s.style.textDecoration=[c.underline?'underline':'',c.crossedOut?'line-through':''].filter(Boolean).join(' ');s.textContent=c.continuation?'':(c.text||' ');return s}function render(rows){normalize();for(const r of rows){if(r<0||r>=model.rows)continue;let d=$('screen').children[r];if(!d){d=document.createElement('div');d.className='termrow';$('screen').appendChild(d)}d.replaceChildren(...model.lines[r].map((c,i)=>span(c,r,i)))}while($('screen').children.length>model.rows)$('screen').lastChild.remove();$('geometry').textContent=model.columns+'×'+model.rows;$('revision').textContent='rev '+model.revision}
function snap(x){const p=x.panel||x;model.rows=p.rows||model.rows;model.columns=p.columns||model.columns;model.revision=p.revision||0;model.cursor=p.cursor||model.cursor;model.lines=p.lines||[];if(x.tier==='capsule')$('mode').value='stdin';$('state').textContent=(x.vmId||active)+' · '+(x.facet||'')+' · '+(x.phase||'');$('state').className='badge '+(x.phase==='live'?'ok':x.phase==='closed'?'bad':'');render(Array.from({length:model.rows},(_,i)=>i));lastCursor={...model.cursor};$('manualRail').replaceChildren();$('causalRail').replaceChildren();for(const s of x.signals||[])signal(s)}function patch(ps){const touched=new Set([lastCursor.row,model.cursor.row]);for(const p of ps||[]){model.revision=Math.max(model.revision,p.revision||0);if(!model.lines[p.y])model.lines[p.y]=Array.from({length:model.columns},blank);for(let i=0;i<(p.cells||[]).length;i++)if(p.x+i<model.columns)model.lines[p.y][p.x+i]=p.cells[i];touched.add(p.y)}render([...touched]);lastCursor={...model.cursor}}
function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}function signal(s){if(!s||document.querySelector('[data-signal="'+CSS.escape(s.id)+'"]'))return;const d=document.createElement('div');d.className='sig '+s.lane+(s.kind==='failed'?' failed':'');d.dataset.signal=s.id;d.innerHTML='<b>'+esc(s.kind)+'</b> #'+esc((s.id||'').replace('sha256:','').slice(0,9))+(s.causeSignalId?'<div class="cause">← '+esc(s.causeSignalId.replace('sha256:','').slice(0,9))+'</div>':'')+'<div>'+esc((s.payload||'').replace(/[\x00-\x1f]/g,' ').slice(0,120))+'</div>';const rail=s.lane==='manual'?$('manualRail'):$('causalRail');rail.prepend(d);while(rail.children.length>100)rail.lastChild.remove()}
async function terminals(){const x=await (await fetch('/api/vm/terminals')).json(),list=x.terminals||[];if(!active&&list.length)active=list[0].vmId;$('tabs').innerHTML=list.map(t=>'<button class="tab '+(t.vmId===active?'active':'')+'" data-id="'+esc(t.vmId)+'">'+esc(t.vmId)+' · '+esc(t.tier)+'</button>').join('');for(const b of $('tabs').children)b.onclick=()=>select(b.dataset.id);if(active)load()}async function select(id){active=id;history.replaceState(null,'','/vm-terminal?id='+encodeURIComponent(id));await terminals()}async function load(){if(!active)return;const r=await fetch('/api/vm/'+encodeURIComponent(active)+'/terminal');if(r.ok)snap(await r.json())}
async function send(){if(!active)return;const text=$('command').value;if(!text)return;$('command').value='';await fetch('/api/vm/'+encodeURIComponent(active)+'/terminal/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,mode:$('mode').value})})}$('send').onclick=send;$('command').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};$('screen').onclick=()=>$('command').focus();
let rt;function fit(){clearTimeout(rt);rt=setTimeout(async()=>{if(!active)return;const w=$('screenWrap').getBoundingClientRect(),probe=document.createElement('span');probe.className='cell';probe.textContent='M';$('screen').appendChild(probe);const b=probe.getBoundingClientRect();probe.remove();const columns=Math.max(20,Math.min(220,Math.floor((w.width-32)/(b.width||8)))),rows=Math.max(6,Math.min(80,Math.floor((w.height-28)/(b.height||16))));if(columns!==model.columns||rows!==model.rows)await fetch('/api/vm/'+encodeURIComponent(active)+'/terminal/resize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({columns,rows})})},250)}addEventListener('resize',fit);
function connect(){const e=new EventSource('/api/vm/terminal/events');e.onmessage=m=>{const x=JSON.parse(m.data);if(x.vmId!==active)return;if(x.kind==='manual')signal(x.signal);else if(x.kind==='causal'){signal(x.signal);if(x.terminal){model.cursor=x.terminal.cursor||model.cursor;model.revision=x.terminal.revision||model.revision;model.columns=x.terminal.columns||model.columns;model.rows=x.terminal.rows||model.rows}patch(x.patches)}else if(x.kind==='phase'){$('state').textContent=active+' · '+x.phase}};e.onerror=()=>{e.close();load();setTimeout(connect,1500)}}
terminals().then(fit);setInterval(terminals,10000);connect();$('command').focus();
</script></body></html>
