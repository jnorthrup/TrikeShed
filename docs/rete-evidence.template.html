<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rete Connection Evidence</title>
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#fff, #191919); --fg: light-dark(#202124, #ededed); --line: light-dark(#c9cccf, #555); --muted: light-dark(#f2f3f4, #272727); --teal: light-dark(#06756c, #69d0bf); --red: light-dark(#a52658, #ef98b5); }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header, main { max-width: 1440px; margin: auto; padding: 16px; }
    header { border-bottom: 1px solid var(--line); }
    nav, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    a { color: inherit; }
    h1 { font-size: 22px; margin: 12px 0 4px; }
    p { margin: 6px 0; overflow-wrap: anywhere; }
    label { display: grid; gap: 4px; min-width: 0; }
    input, select, button { font: inherit; max-width: 100%; min-height: 36px; }
    input[type=file] { width: 270px; }
    select { min-width: 0; width: 100%; padding: 5px; }
    #picker { width: min(100%, 490px); }
    #picker-label { flex: 1 1 280px; max-width: 490px; }
    .controls { margin: 12px 0; }
    #origin { font-weight: 650; color: var(--red); }
    #summary, #count { font-variant-numeric: tabular-nums; }
    .graph { overflow: auto; border-block: 1px solid var(--line); margin: 12px 0; }
    svg { display: block; width: 940px; min-width: 940px; }
    .edge { stroke: var(--teal); stroke-width: 1.5; fill: none; }
    .node rect { fill: var(--bg); stroke: var(--line); }
    .node text { fill: var(--fg); font-size: 13px; }
    .node { cursor: pointer; }
    .node:focus rect, .selected rect { stroke: var(--red); stroke-width: 2; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; overflow-wrap: anywhere; }
    th { font-size: 12px; }
    .evidence { background: none; border: 0; padding: 0; color: var(--teal); text-align: left; text-decoration: underline; overflow-wrap: anywhere; }
    details { margin-top: 16px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: var(--muted); max-height: 420px; overflow: auto; }
    #error { color: var(--red); }
    dialog { max-width: min(740px, 94%); border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    @media (max-width: 540px) { header, main { padding: 12px; } th, td { padding: 6px 3px; } input, select, button { min-height: 44px; } }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Documentation"><a href="https://jnorthrup.github.io/TrikeShed/">GitHub Pages</a><a href="./demo/index.html">Old demo</a><a href="./index.html">Index</a></nav>
    <h1>Rete Connection Evidence</h1>
    <p id="origin"></p><p id="summary" aria-live="polite"></p>
  </header>
  <main>
    <div class="controls">
      <label>Snapshot JSON<input type="file" id="upload" accept=".json,application/json"></label>
      <button type="button" id="download">Download snapshot</button>
    </div>
    <p id="error" role="alert"></p>
    <div class="controls">
      <label id="picker-label">Recorded entity<select id="picker" aria-label="Recorded entity"></select></label>
      <label>Connections<select id="mode"><option value="direct">Direct evidence</option><option value="ancestors">Ancestor bits</option><option value="descendants">Descendant bits</option></select></label>
      <button type="button" id="previous" aria-label="Previous connections">Previous</button>
      <button type="button" id="next" aria-label="Next connections">Next</button>
    </div>
    <p id="count" aria-live="polite"></p>
    <div class="graph"><svg id="graph" aria-label="Recorded connections" role="group"></svg></div>
    <table aria-label="Connection evidence"><thead><tr><th>From</th><th>Relationship</th><th>To</th><th>Evidence</th></tr></thead><tbody id="ledger"></tbody></table>
    <details><summary>Selected record</summary><pre id="record"></pre></details>
    <details><summary>Capture scope and omissions</summary><pre id="scope"></pre></details>
  </main>
  <dialog id="detail"><form method="dialog"><button>Close evidence</button></form><pre id="detail-text"></pre></dialog>
  <script id="snapshot" type="application/json">/* SNAPSHOT_DATA */</script>
  <script>
/* EVIDENCE_MODEL */
(() => {
  const $ = id => document.getElementById(id);
  let data, model, selected, offset = 0;
  const pageSize = 12, ns = 'http://www.w3.org/2000/svg';
  function showEvidence(pointer, raw) { $('detail-text').textContent = pointer + '\n\n' + JSON.stringify(raw, null, 2); $('detail').showModal(); }
  function load(snapshot) {
    const nextModel = evidenceModel(snapshot);
    data = snapshot; model = nextModel;
    $('error').textContent = '';
    $('origin').textContent = data.capture?.kind === 'isolated-proof' ? 'ISOLATED PROOF RUN: synthetic job input, real production code and SUMO corpus' : 'IMPORTED SNAPSHOT: ' + (data.capture?.kind ?? 'origin not supplied');
    $('summary').textContent = `${data.facts.rows.length} of ${data.facts.matched} matching facts; ${data.trace.receipts.length} retained admissions; ${data.trace.dropped} discarded; ${data.ontology?.nodes.length ?? 0} subclass-index nodes`;
    $('scope').textContent = JSON.stringify({capture:data.capture, scope:data.scope, factPage:{...data.facts, rows:undefined}, trace:{...data.trace, receipts:undefined}}, null, 2);
    $('picker').replaceChildren();
    for (const kind of ['admission', 'fact', 'production', 'term', 'tuple', 'content']) {
      const group = document.createElement('optgroup'); group.label = kind;
      for (const node of [...model.nodes.values()].filter(n => n.kind === kind).sort((a,b) => a.label.localeCompare(b.label))) {
        const option = document.createElement('option'); option.value = node.id; option.textContent = node.label; group.append(option);
      }
      if (group.children.length) $('picker').append(group);
    }
    select($('picker').value);
  }
  function select(id) { selected = id; offset = 0; $('picker').value = id; draw(); }
  function svgElement(tag, attrs, text) {
    const el = document.createElementNS(ns, tag);
    for (const [key,value] of Object.entries(attrs)) el.setAttribute(key, value);
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function draw() {
    const focus = model.nodes.get(selected), svg = $('graph'); svg.replaceChildren(); $('ledger').replaceChildren();
    if (!focus) { $('count').textContent = 'No recorded entities'; $('record').textContent = ''; return; }
    const all = incidentEvidence(model, selected, $('mode').value), shown = all.slice(offset, offset + pageSize);
    $('previous').disabled = offset === 0; $('next').disabled = offset + pageSize >= all.length;
    $('mode').disabled = focus.kind !== 'term';
    $('count').textContent = all.length ? `${offset + 1}-${offset + shown.length} of ${all.length} connections for ${focus.label}` : `No recorded connections for ${focus.label}`;
    $('record').textContent = focus.pointer + '\n\n' + JSON.stringify(focus.raw, null, 2);
    const left = [...new Set(shown.filter(e => e.to === selected && e.from !== selected).map(e => e.from))];
    const right = [...new Set(shown.filter(e => e.from === selected && e.to !== selected).map(e => e.to))];
    const height = Math.max(180, Math.max(left.length, right.length) * 86 + 32);
    svg.setAttribute('viewBox', `0 0 940 ${height}`); svg.setAttribute('height', height);
    const positions = new Map([[selected, {x:350, y:height/2 - 28}]]);
    left.forEach((id,i) => positions.set(id, {x:8, y:16 + i*86}));
    right.forEach((id,i) => { if (!positions.has(id)) positions.set(id, {x:692, y:16 + i*86}); });
    const defs = svgElement('defs', {}), marker = svgElement('marker', {id:'arrow', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:6, markerHeight:6, orient:'auto-start-reverse'});
    marker.append(svgElement('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:'var(--teal)'})); defs.append(marker); svg.append(defs);
    for (const edge of shown) {
      const a = positions.get(edge.from), b = positions.get(edge.to);
      if (a && b && edge.from !== edge.to) {
        const forward = a.x < b.x, x1 = a.x + (forward ? 240 : 0), x2 = b.x + (forward ? 0 : 240);
        svg.append(svgElement('path', {class:'edge', 'marker-end':'url(#arrow)', d:`M ${x1} ${a.y+28} C ${(x1+x2)/2} ${a.y+28}, ${(x1+x2)/2} ${b.y+28}, ${x2} ${b.y+28}`}));
      }
      const row = document.createElement('tr');
      for (const text of [model.nodes.get(edge.from).label, edge.kind, model.nodes.get(edge.to).label]) { const cell = document.createElement('td'); cell.textContent = text; row.append(cell); }
      const cell = document.createElement('td'), button = document.createElement('button'); button.type = 'button'; button.className = 'evidence'; button.textContent = edge.pointer; button.onclick = () => showEvidence(edge.pointer, edge.raw); cell.append(button); row.append(cell); $('ledger').append(row);
    }
    for (const [id, p] of positions) {
      const n = model.nodes.get(id), group = svgElement('g', {class:'node' + (id === selected ? ' selected' : ''), transform:`translate(${p.x} ${p.y})`, role:'button', tabindex:0, 'aria-label':n.label});
      group.append(svgElement('rect', {width:240, height:56, rx:4}), svgElement('title', {}, n.label));
      const label = n.label.length > 58 ? n.label.slice(0,55) + '...' : n.label;
      const lines = label.match(/.{1,29}/g) ?? [''];
      lines.forEach((line,i) => group.append(svgElement('text', {x:12, y:lines.length === 1 ? 33 : 23+i*18}, line)));
      group.onclick = () => select(id); group.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(id); } }; svg.append(group);
    }
  }
  $('picker').onchange = () => select($('picker').value);
  $('mode').onchange = () => { offset = 0; draw(); };
  $('previous').onclick = () => { offset = Math.max(0, offset-pageSize); draw(); };
  $('next').onclick = () => { offset += pageSize; draw(); };
  $('upload').onchange = async () => { try { load(JSON.parse(await $('upload').files[0].text())); } catch (error) { $('error').textContent = error.message; } };
  $('download').onclick = () => { const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = 'rete-connections.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try { load(JSON.parse($('snapshot').textContent)); } catch (error) { $('error').textContent = error.message; }
})();
  </script>
</body>
</html>
