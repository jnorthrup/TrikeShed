<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oroboros Board</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #ffffff; --ink: #2b2a27; --muted: #8a867c;
    --line: #e2ded4; --accent: #4a6fa5; --danger: #b3543f; --ok: #5a8a5e; --amber: #c98f2a;
    --card-shadow: 0 1px 3px rgba(40,36,28,.10), 0 1px 2px rgba(40,36,28,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #201f1c; --panel: #2a2926; --ink: #e8e5dd; --muted: #98938a;
      --line: #3a3833; --accent: #7d9fc9; --danger: #cf7a63; --ok: #7fae83; --amber: #e0a94a;
      --card-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; padding: 14px 20px 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; }
  header .seq { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* The timeline strip below is ~8 rows tall; the board leaves it room so the
     last lane row is never hidden behind it. */
  #board {
    display: flex; gap: 12px; padding: 6px 20px 170px; align-items: flex-start;
    overflow-x: auto; min-height: 70vh;
  }
  .lane {
    background: color-mix(in srgb, var(--panel) 62%, var(--bg));
    border: 1px solid var(--line); border-radius: 12px;
    min-width: 250px; max-width: 300px; flex: 1 0 250px;
    display: flex; flex-direction: column; max-height: calc(100vh - 260px);
  }
  .lane.drop-ok { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .lane h2 {
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    margin: 0; padding: 12px 14px 8px; color: var(--muted); font-weight: 650;
    display: flex; align-items: center; gap: 8px;
  }
  .lane h2 .count { font-weight: 400; }
  .lane h2 .wip { margin-left: auto; font-weight: 400; font-size: 12px; }
  .lane h2 .wip.full { color: var(--danger); font-weight: 650; }
  /* "+N": more cards changed in one frame than the 120 ms stagger can show
     distinctly (8 slots); the badge says how many share the last slot. */
  .lane h2 .burst { font-weight: 650; font-size: 11px; color: var(--amber); letter-spacing: 0; text-transform: none; }
  .cards { padding: 4px 10px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow); padding: 10px 12px; cursor: grab; position: relative;
  }
  .card.dragging { opacity: .45; }
  .card .t { font-weight: 550; word-wrap: break-word; padding-right: 18px; }
  .card .meta { display: flex; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .card .owner { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); border-radius: 20px; padding: 1px 9px; }
  .card .heat { color: var(--danger); }
  .card .archive {
    position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted);
    font-size: 15px; padding: 2px 4px; line-height: 1; cursor: pointer;
  }
  .card .archive:hover { color: var(--danger); }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0; }
  .card .tag {
    font-size: 10px; line-height: 1.5; padding: 1px 6px; border-radius: 999px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .card .tag.patch { color: var(--ok); border-color: var(--ok); }
  .card .deps { font-size: 10px; color: var(--muted); margin-top: 4px; }
  /* Delta 2026-09-05 (fan-out): a family (parent + its child cards) shares one
     hue on the left border; a child sitting in the same lane as its parent is
     indented under it and wears an "↑ parent" chip; the parent wears the
     children tally so a viewer can count the fan-in without opening anything. */
  .card.family { border-left-width: 4px; border-left-style: solid; }
  .card.child { margin-left: 14px; }
  .card .parentchip {
    display: inline-block; font-size: 10px; line-height: 1.5; padding: 1px 6px; border-radius: 999px;
    color: var(--muted); border: 1px dashed var(--line); margin-top: 4px;
  }
  .card .kids { font-size: 11px; margin-top: 4px; color: var(--muted); }
  .card .kids.ready { color: var(--ok); font-weight: 600; }
  .card .kids.blocked { color: var(--danger); }
  /* Delta 2026-09-05 (fan-out): per-card flash. The animation runs 700 ms from
     the moment the change was seen; a DOM rebuild re-applies the class with a
     negative animation-delay so the card resumes at phase instead of
     restarting. fill-mode forwards: a staggered card (positive delay) looks
     normal until its slot, and the 100% frame IS the resting look. */
  @keyframes cardFlash {
    0%   { box-shadow: 0 0 0 3px var(--flash), var(--card-shadow); background: color-mix(in srgb, var(--flash) 24%, var(--panel)); }
    100% { box-shadow: 0 0 0 0 transparent, var(--card-shadow); background: var(--panel); }
  }
  .card.flash { --flash: var(--accent); animation: cardFlash 700ms ease-out forwards; }
  .card.flash-new { --flash: var(--ok); }
  .card.flash-moved { --flash: var(--accent); }
  .card.flash-claimed { --flash: var(--amber); }
  .card.flash-revised { --flash: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .card.flash { animation: none; outline: 2px solid var(--flash); outline-offset: 1px; }
  }
  .addrow { padding: 0 10px 12px; display: flex; gap: 6px; align-items: stretch; }
  .addrow input {
    flex: 1 1 auto; min-width: 0; font: inherit; padding: 7px 10px; border-radius: 8px;
    border: 1px dashed var(--line); background: transparent; color: var(--ink);
  }
  .addrow input:focus:not(:focus-visible) { outline: none; }
  .addrow input:focus { outline: none; border-color: var(--accent); border-style: solid; }
  /* Enter alone used to be the ONLY way to add a card. A board whose primary
     verb is invisible reads as a board that does not work. */
  .addrow button {
    flex: 0 0 auto; font: inherit; line-height: 1; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    cursor: pointer;
  }
  .addrow button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .addrow button:disabled { opacity: .45; cursor: default; }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 18px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw;
    z-index: 5;
  }
  #toast.show { opacity: .96; }
  dialog {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
    padding: 20px; width: min(560px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; }
  dialog p { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  dialog textarea {
    width: 100%; height: 180px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px;
  }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .empty-board {
    padding: 40px 20px; text-align: center; color: var(--muted); width: 100%;
  }
  /* Delta 2026-09-05 (fan-out): the ticker was one overwritten line, so a burst
     of N commits read as one. It is a timeline strip now: one row per fact,
     newest first, server timestamps only. */
  #ticker {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 4px 20px 6px; font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--muted);
  }
  #ticker b { color: var(--ok); font-weight: 650; }
  #ticker .k { color: var(--accent); }
  #wire { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #timeline {
    list-style: none; margin: 2px 0 0; padding: 0; max-height: 7.5em; overflow-y: auto;
    border-top: 1px dashed var(--line);
  }
  #timeline li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 10px; align-items: baseline; }
  #timeline li .ts { color: var(--ink); font-variant-numeric: tabular-nums; }
  #timeline li .ts.unknown { color: var(--danger); }
  #timeline li .id { color: var(--accent); }
  #timeline li .rev { color: var(--muted); }
  #timeline li small { color: var(--muted); margin-left: auto; padding-left: 10px; }
  #timeline li.rule { opacity: .55; }
  #timeline li.frame { opacity: .6; font-style: italic; }
  #timeline li.burst .n { color: var(--amber); font-weight: 650; }
  #timeline li.claim .good { color: var(--ok); font-weight: 650; }
  #timeline li.claim .bad { color: var(--danger); font-weight: 650; }
</style>
</head>
<body data-app-page="kanban">
<header>
  <h1>Oroboros Board</h1>
  <span class="seq" id="seq"></span>
  <span class="spacer"></span>
  <button id="importBtn">Import a plan…</button>
</header>
<div id="board"></div>
<div id="ticker">
  <div id="wire">daemon wire: connecting…</div>
  <ol id="timeline"></ol>
</div>
<div id="toast"></div>

<dialog id="importDlg">
  <h3>Import a plan</h3>
  <p>Paste a plan or to-do list. Every bullet line (<code>-</code>, <code>*</code>, or <code>1.</code>) becomes a card. Re-importing the same list is safe — duplicates are skipped.</p>
  <textarea id="importText" placeholder="- Ship the release notes&#10;- Review the tribunal preset&#10;- Archive stale cards"></textarea>
  <div class="row">
    <button id="importCancel">Cancel</button>
    <button class="primary" id="importGo">Import</button>
  </div>
</dialog>

</body>
</html>
