<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/forge-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/forge-icon-maskable.svg" />
  <title>Forge</title>
  <style>
{{STYLES}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="workspace-switcher" role="button" tabindex="0" aria-label="Switch workspace">
          <div class="workspace-icon" aria-hidden="true">F</div>
          <div class="workspace-name">Forge workspace</div>
        </div>
        <div class="sidebar-actions">
          <button class="sidebar-item" id="btn-search" title="Search" aria-label="Search workspace">
            <span class="sidebar-item-icon" aria-hidden="true">⌕</span><span>Search</span>
          </button>
          <button class="sidebar-item" id="btn-home" title="Home" aria-label="Go to Home">
            <span class="sidebar-item-icon" aria-hidden="true">⌂</span><span>Home</span>
          </button>
          <button class="sidebar-item" id="btn-board" title="Board" aria-label="Go to Board view">
            <span class="sidebar-item-icon" aria-hidden="true">▦</span><span>Board</span>
          </button>
          <button class="sidebar-item" id="btn-graph" title="Graph" aria-label="Go to Graph view">
            <span class="sidebar-item-icon" aria-hidden="true">◉</span><span>Graph</span>
          </button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Private</div>
        <div id="page-tree" class="page-tree"></div>
        <button class="sidebar-item sidebar-add" id="btn-new-page" aria-label="Add a new page">
          <span class="sidebar-item-icon" aria-hidden="true">+</span><span>Add a page</span>
        </button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Ingest</div>
        <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-label="Drop files or click to upload">
          <span class="drop-zone-icon" aria-hidden="true">⬇</span>
          <span class="drop-zone-text">Drag resumes, job postings, PDFs, DOCX<br>or click to select files</span>
          <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md,.html,.json" hidden />
        </div>
        <div class="ingest-queue" id="ingest-queue" hidden>
          <div class="ingest-queue-header">Processing</div>
          <div class="ingest-items" id="ingest-items"></div>
        </div>
      </div>
      <details class="sidebar-section sidebar-gallery">
        <summary class="sidebar-section-label">Gallery</summary>
        <div class="sidebar-gallery-body">{{GALLERY}}</div>
      </details>
      <div class="sidebar-bottom">
        <div class="sidebar-seed-note" id="seed-note"></div>
        <div class="sidebar-sync-note" id="sync-note" aria-live="polite"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-topbar" id="main-topbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="btn-view-doc" aria-label="View Document">Document</button>
          <button class="topbar-btn" id="btn-view-board" aria-label="View Board">Board</button>
          <button class="topbar-btn" id="btn-view-graph" aria-label="View Graph">Graph</button>
          <button class="topbar-btn" id="btn-share" aria-label="Share">Share</button>
        </div>
      </div>
      <div class="doc-scroll" id="doc-scroll">
        <div class="doc-page" id="doc-page">
          <div class="doc-cover-spacer"></div>
          <div class="doc-title-row">
            <div class="doc-icon" id="doc-icon" aria-hidden="true">▤</div>
            <h1 class="doc-title" id="doc-title" contenteditable="true" spellcheck="false" aria-label="Document title" data-placeholder="Untitled"></h1>
          </div>
          <div class="doc-blocks" id="doc-blocks"></div>
          <div class="doc-hint" id="doc-hint">Type <span class="doc-hint-key">/</span> for commands</div>
        </div>
      </div>
      <div class="board-scroll" id="board-scroll" hidden>
        <div class="board-canvas" id="board-canvas"></div>
      </div>
      <div class="graph-scroll" id="graph-scroll" hidden>
        <div class="graph-hud" id="graph-hud">
          <button class="topbar-btn" id="graph-fit" aria-label="Fit graph to viewport" title="Fit (f)">Fit</button>
          <span class="graph-zoom-pill" id="graph-zoom-pill" aria-live="polite">100%</span>
        </div>
        <svg class="graph-canvas" id="graph-canvas" role="img" aria-label="Causal graph"></svg>
        <div class="graph-empty" id="graph-empty" hidden>No causal nodes in the seed yet — ingest a donor to populate the graph.</div>
      </div>
    </main>
  </div>

  <div class="slash-menu" id="slash-menu" hidden></div>

  <script id="forge-seed" type="application/json">{{SEED}}</script>
  <script>
{{SCRIPT}}
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed:', err);
          });
      });
      window.addEventListener('online', () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            if (reg.sync) reg.sync.register('sync-blackboard');
          });
        }
      });
    }
  </script>
</body>
</html>
