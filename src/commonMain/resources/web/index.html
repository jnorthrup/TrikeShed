<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/forge-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/forge-icon-maskable.svg" />
  <title>Forge</title>
  <style>
{{STYLES}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="workspace-switcher" role="button" tabindex="0" title="Switch workspace">
          <div class="workspace-icon" aria-hidden="true">F</div>
          <div class="workspace-name">Forge workspace</div>
        </div>
        <div class="sidebar-actions">
          <button class="sidebar-item" id="btn-search" title="Search" aria-label="Search">
            <span class="sidebar-item-icon" aria-hidden="true">⌕</span><span>Search</span>
          </button>
          <button class="sidebar-item" id="btn-home" title="Home" aria-label="Home">
            <span class="sidebar-item-icon" aria-hidden="true">⌂</span><span>Home</span>
          </button>
          <button class="sidebar-item" id="btn-board" title="Board" aria-label="Board">
            <span class="sidebar-item-icon" aria-hidden="true">▦</span><span>Board</span>
          </button>
          <button class="sidebar-item" id="btn-graph" title="Graph" aria-label="Graph">
            <span class="sidebar-item-icon" aria-hidden="true">◉</span><span>Graph</span>
          </button>
          <button class="sidebar-item" id="btn-sheet" title="Sheet" aria-label="Sheet">
            <span class="sidebar-item-icon" aria-hidden="true">▤</span><span>Sheet</span>
          </button>
          <button class="sidebar-item" id="btn-host" title="Host" aria-label="Host">
            <span class="sidebar-item-icon" aria-hidden="true">⬢</span><span>Host</span>
          </button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Private</div>
        <div id="page-tree" class="page-tree"></div>
        <button class="sidebar-item sidebar-add" id="btn-new-page">
          <span class="sidebar-item-icon" aria-hidden="true">+</span><span>Add a page</span>
        </button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Ingest</div>
        <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-label="Drop files or click to upload">
          <span class="drop-zone-icon" aria-hidden="true">⬇</span>
          <span class="drop-zone-text">Drop .md / .pdf / .docx / scans / .mp4 — shape, gate, ingest</span>
          <input type="file" id="file-input" multiple accept=".md,.txt,.pdf,.docx,.doc,.pptx,.xlsx,.png,.jpg,.jpeg,.tif,.tiff,.mp4,.m4a,.mov,.heic" hidden />
        </div>
      </div>
      <details class="sidebar-section sidebar-gallery">
        <summary class="sidebar-section-label">Gallery</summary>
        <div class="sidebar-gallery-body">{{GALLERY}}</div>
      </details>
      <div class="sidebar-bottom">
        <div class="sidebar-seed-note" id="seed-note"></div>
        <div class="sidebar-sync-note" id="sync-note" aria-live="polite"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-topbar" id="main-topbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="btn-view-doc" title="View Document">Document</button>
          <button class="topbar-btn" id="btn-view-board" title="View Board">Board</button>
          <button class="topbar-btn" id="btn-view-graph" title="View Graph">Graph</button>
          <button class="topbar-btn" id="btn-view-sheet" title="View Sheet">Sheet</button>
          <button class="topbar-btn" id="btn-view-shape" title="View Shape">Shape</button>
          <button class="topbar-btn" id="btn-view-host" title="View Host">Host</button>
          <button class="topbar-btn" id="btn-share" title="Share">Share</button>
        </div>
      </div>
      <div class="doc-scroll" id="doc-scroll">
        <div class="doc-page" id="doc-page">
          <div class="doc-cover-spacer"></div>
          <div class="doc-title-row">
            <div class="doc-icon" id="doc-icon" aria-hidden="true">▤</div>
            <h1 class="doc-title" id="doc-title" contenteditable="true" spellcheck="false" aria-label="Document title" data-placeholder="Untitled"></h1>
          </div>
          <div class="doc-blocks" id="doc-blocks"></div>
          <div class="doc-hint" id="doc-hint">Type <span class="doc-hint-key">/</span> for commands</div>
        </div>
      </div>
      <div class="board-scroll" id="board-scroll" hidden>
        <div class="board-canvas" id="board-canvas"></div>
      </div>
      <div class="graph-scroll" id="graph-scroll" hidden>
        <div class="graph-hud" id="graph-hud">
          <span class="graph-mode" role="group" aria-label="Graph source">
            <button class="topbar-btn" id="graph-mode-causal" aria-label="Causal">Causal</button>
            <button class="topbar-btn" id="graph-mode-concept" title="Concept lattice: lib → cursor → confix → facets → surface → widgets">Concepts</button>
          </span>
          <button class="topbar-btn" id="graph-fit" title="Fit (f)">Fit</button>
          <span class="graph-zoom-pill" id="graph-zoom-pill" aria-live="polite">100%</span>
        </div>
        <div class="graph-inspector" id="graph-inspector" hidden aria-live="polite"></div>
        <svg class="graph-canvas" id="graph-canvas" role="img" aria-label="Causal graph"></svg>
        <div class="graph-empty" id="graph-empty" hidden>No causal nodes in the seed yet — ingest a donor to populate the graph.</div>
      </div>
      <div class="sheet-scroll" id="sheet-scroll" hidden>
        <div class="sheet-tabs" id="sheet-tabs" role="tablist" aria-label="Sheets"></div>
        <div class="sheet-crumbs" id="sheet-crumbs"></div>
        <div class="sheet-grid-wrap" id="sheet-grid-wrap"></div>
        <div class="sheet-empty" id="sheet-empty" hidden>No sheets in the seed.</div>
      </div>
      <div class="shape-scroll" id="shape-scroll" hidden></div>
      <div class="host-scroll" id="host-scroll" hidden>
        <div class="host-tiles" id="host-tiles"></div>
        <h3 class="host-h">Sub-VMs <span class="sheet-count" id="host-vm-count"></span></h3>
        <div id="host-vms"></div>
        <form class="host-form" id="host-spawn" autocomplete="off">
          <input id="host-vm-id" placeholder="id" aria-label="VM id" />
          <select id="host-vm-facet" aria-label="Language facet"></select>
          <select id="host-vm-trust" aria-label="Trust"><option value="OWN">OWN · in-process</option><option value="UNTRUSTED">UNTRUSTED · fenced process</option></select>
          <textarea id="host-vm-src" placeholder="source, e.g. 1+1" aria-label="Source"></textarea>
          <button type="submit" class="topbar-btn" id="host-vm-run" title="Spawn and evaluate">Spawn + eval</button>
          <span class="host-live-note" id="host-live-note"></span>
        </form>
        <h3 class="host-h">Events</h3>
        <pre class="host-log" id="host-log" aria-live="polite"></pre>
      </div>
    </main>
  </div>

  <div class="slash-menu" id="slash-menu" hidden></div>

  <script id="forge-seed" type="application/json">{{SEED}}</script>
  <script>
{{SCRIPT}}
  </script>
{{BUNDLES}}
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed:', err);
          });
      });
      window.addEventListener('online', () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            if (reg.sync) reg.sync.register('sync-blackboard');
          });
        }
      });
    }
  </script>
</body>
</html>
