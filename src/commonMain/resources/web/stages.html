<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pachinko · trikeshed</title>
<link rel="icon" href="/icons/forge-icon.svg">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0d12;color:#f3f1ea;font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stages{flex:1;position:relative;min-height:0}
#stages-status{position:absolute;left:12px;bottom:6px;font-size:13px;color:#5d6877;pointer-events:none}
#stages-launch{position:absolute;right:1.4%;top:1.6%;width:42.4%;bottom:12%;background:#161c26;border:2px solid #e8ba50;border-radius:18px;padding:22px 24px;
  display:flex;flex-direction:column;gap:12px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#stages-launch[hidden]{display:none}
#stages-launch h2{margin:0;font-size:26px}
#stages-launch label{display:flex;flex-direction:column;gap:5px;font-size:16px;color:#9ca8b6}
#stages-launch textarea,#stages-launch input,#stages-launch select{font:17px/1.35 system-ui,sans-serif;padding:9px 11px;border:1px solid #3c485a;border-radius:10px;color:#f3f1ea;background:#0b0d12}
#stages-passage{font:15px/1.4 ui-monospace,Menlo,monospace!important;flex:1;min-height:120px;background:#f4ebd6!important;color:#2a2520!important}
#stages-launch .row{display:flex;gap:12px}
#stages-launch .row>*{flex:1}
#stages-launch button{font:700 18px system-ui,sans-serif;padding:11px 18px;border-radius:12px;border:1px solid #46546a;background:#1a202c;color:#f3f1ea;cursor:pointer}
#stages-launch button[type=submit]{background:#e8ba50;color:#0b0d12;border-color:#e8ba50}
#stages-launch-status{min-height:22px;color:#ff6860;font-size:16px}
</style>
</head>
<body data-app-page="stages">
<div id="stages" aria-label="Pachinko: the ingest stages as a machine">
<form id="stages-launch" hidden>
<h2>A new ball</h2>
<label>The claim <textarea id="stages-claim" rows="2" required placeholder="one sentence about the passage"></textarea></label>
<div class="row">
<label>What you know <select id="stages-states"><option value="true">the passage states it</option><option value="false">the passage does not state it</option></select></label>
<label>How sure (0 to 1) <input id="stages-confidence" type="number" min="0.01" max="1" step="0.01" value="1"></label>
</div>
<div class="row">
<label>Whose outcome <select id="stages-author"><option value="person">a person's: the truth</option><option value="model">a model's: a candidate</option></select></label>
<label>The model's id, for a model <input id="stages-model"></label>
</div>
<label style="flex:1">The passage <textarea id="stages-passage" placeholder="the passage the claim is about"></textarea></label>
<div id="stages-launch-status" aria-live="polite"></div>
<div class="row"><button type="submit">Drop it</button><button type="button" id="stages-cancel">Cancel</button></div>
</form>
<div id="stages-status" aria-live="polite"></div>
</div>
<script src="/kotlin/spacegraph/spacegraph.js" defer></script>
</body>
</html>
