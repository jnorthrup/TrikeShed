<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VM Terminals · TrikeShed</title>
<style>
:root{--bg:#090b10;--panel:#11151e;--line:#293142;--ink:#d8dce6;--dim:#7d879a;--amber:#f2a011;--green:#3ddc84;--red:#ff5964;--cyan:#3fd0ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}header,#tabs,footer{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}header b{color:var(--amber)}#tabs{overflow:auto;padding:5px 10px}.tab,button,input,select{font:inherit;color:var(--ink);background:#171d28;border:1px solid var(--line);border-radius:3px;padding:4px 8px}.tab{cursor:pointer;white-space:nowrap}.tab.active{border-color:var(--amber);color:var(--amber)}.badge{border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--dim)}main{min-height:0;display:grid;grid-template-columns:minmax(500px,1fr) 300px;gap:1px;background:var(--line)}#screenWrap{background:#050607;overflow:auto;padding:10px;display:flex;align-items:flex-start;justify-content:center}#screen{outline:none;background:#000;padding:5px 6px;box-shadow:0 0 0 1px #222;font:14px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none}.termrow{height:1.15em;white-space:pre}.cell{display:inline-block;width:.61em;height:1.15em;overflow:visible;vertical-align:top}.cursor{outline:1px solid var(--amber);background:rgba(242,160,17,.35)!important}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.15}}#rails{background:var(--panel);display:grid;grid-template-rows:auto 1fr 1fr;min-height:0}#rails h2{font-size:10px;letter-spacing:.1em;color:var(--dim);margin:0;padding:8px;border-bottom:1px solid var(--line)}.rail{overflow:auto;padding:4px;border-bottom:1px solid var(--line)}.sig{font-size:10px;padding:4px 6px;margin:3px 0;border-left:3px solid var(--dim);background:#161b25;word-break:break-word}.sig.manual{border-color:var(--amber)}.sig.causal{border-color:var(--cyan)}.sig.failed{border-color:var(--red)}.cause{color:var(--cyan)}footer{border-top:1px solid var(--line);border-bottom:0}#command{flex:1}.ok{color:var(--green)}.bad{color:var(--red)}a{color:var(--dim)}@media(max-width:850px){main{grid-template-columns:1fr}#rails{display:none}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}
</style></head><body>
<header><b>PROCESS TERMINALS</b><span id="state" class="badge">select a VM</span><span id="geometry" class="badge">–</span><span id="revision" class="badge">rev 0</span><a href="/hermes">Hermes xterm256</a><a href="/graal" style="margin-left:auto">Graal console ↗</a></header>
<div id="tabs"></div>
<main><section id="screenWrap"><div id="screen" tabindex="0" role="application" aria-label="Selected VM terminal"></div></section><aside id="rails"><h2>manual ↔ causal LCNC</h2><div id="manualRail" class="rail"></div><div id="causalRail" class="rail"></div></aside></main>
<footer><select id="mode" aria-label="Input mode"><option value="eval">eval</option><option value="stdin">stdin</option></select><input id="command" autocomplete="off" spellcheck="false" placeholder="Python/JS expression · :status · :clear" aria-label="Command input"><button id="send">send</button></footer>
</body></html>
