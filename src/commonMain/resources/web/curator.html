<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curator scope · trikeshed</title>
<link rel="icon" href="/icons/forge-icon.svg">
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3a;--ink:#e3e7ef;--dim:#8b94a7;--gold:#f0c870}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:14px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line)}
header b{color:var(--gold);font-size:16px;letter-spacing:.02em}
header span{color:var(--dim)}
header kbd{background:#1b2230;border:1px solid var(--line);border-radius:3px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--ink)}
#status{margin-left:auto;font:12px ui-monospace,monospace}
main{flex:1;display:flex;min-height:0}
#curator{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#curator:active{cursor:grabbing}
#curator-panel{min-width:320px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto}
#curator-panel .glyph{width:44px;height:44px;filter:drop-shadow(0 0 12px currentColor);margin-bottom:10px;display:block}
#curator-panel h2{margin:0 0 6px;font-size:20px;text-transform:capitalize}
#curator-panel h2 span{display:block;font-size:13px;color:var(--gold);font-weight:400;text-transform:none}
#curator-panel .gloss{color:#c9d0dc;font-style:italic}
#curator-panel dl{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;font-size:12px}
#curator-panel dt{color:var(--dim)} #curator-panel dd{margin:0;font-family:ui-monospace,monospace;word-break:break-all}
#curator-panel h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px}
#curator-panel ol{padding-left:18px;margin:0;font:11.5px/1.5 ui-monospace,monospace;color:#b8c2d0}
.dim{color:var(--dim)}
#curator-panel{width:460px}
#curator-panel .k{height:6px;background:#1b2230;border-radius:3px;overflow:hidden;margin:6px 0}
#curator-panel .k i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#f0c870,#e05050)}
#curator-panel .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
#curator-panel .chips span{background:#1b2230;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px}
#curator-panel .chips b{color:var(--gold);font-weight:500}
#curator-panel .sent{border-left:2px solid var(--line);padding:2px 0 6px 8px;margin:8px 0}
#curator-panel .said{margin:0 0 4px;color:#d8dde6}#curator-panel .said em{color:var(--dim);font-style:normal}
#curator-panel .ent,#curator-panel .pred{margin:2px 0;font:11px ui-monospace,monospace;color:#9fb0c4}
#curator-panel .stmt{margin:2px 0;font:11.5px ui-monospace,monospace;color:#f5d68c}
#curator-panel .stmt sub{color:#7fa3c9;margin-left:2px}
#curator-panel .tv{color:var(--dim);font-size:11px}#curator-panel .opp{color:#e87a7a;font-size:11px}
#curator-track{position:relative;width:180px;height:24px;align-self:center}
#curator-detail{width:100%;height:24px;margin:0;cursor:ew-resize}
#curator-zoom{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--gold);pointer-events:none;transition:left .08s linear}
#curator-zoom.below{background:#6b7486}
#curator-find{width:300px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#curator-find input{margin:8px 8px 0;padding:5px 8px;background:#0b0e14;border:1px solid var(--line);border-radius:4px;color:var(--ink);font:12px ui-monospace,monospace}
#curator-toc{flex:1;overflow:auto;padding:0 8px 8px}
#curator-toc h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px;display:flex;gap:6px}
#curator-toc h3 a{color:var(--gold);cursor:pointer;text-transform:none;letter-spacing:0}
#curator-toc ol.toc{margin:0;padding-left:22px;font-size:12px}
#curator-toc li{padding:1px 0;cursor:pointer}#curator-toc li:hover b{color:var(--gold)}
#curator-toc li b{font-weight:500}#curator-toc li em{color:var(--dim);font-style:normal;font-size:11px}
#curator-toc li a{color:#7fa3c9;margin-left:4px;font-size:11px}#curator-toc li small{color:#9fb0c4;font:11px ui-monospace,monospace}
</style>
<style>
a:focus:not(:focus-visible), button:focus:not(:focus-visible), input:focus:not(:focus-visible), select:focus:not(:focus-visible), [tabindex="0"]:focus:not(:focus-visible) { outline: none; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
</style>
</head>
<body data-app-page="curator">
<header><b>Curator scope</b><span>the law library: a shelf unit per project, concept pool on its own — wheel/drag to take the camera, it returns to follow after a while · <kbd>space</kbd> pin · <kbd>F</kbd> follow · click a book to open it, <kbd>←</kbd><kbd>→</kbd> turn pages, <kbd>Esc</kbd> close</span><span id="curator-track"><input id="curator-detail" type="range" min="0" max="100" step="1" value="50" aria-label="Detail" title="Snap depth: circles split into their contents once the view reaches this zoom. The tick is the current zoom."><i id="curator-zoom" aria-hidden="true"></i></span><span id="status"><span id="curator-status">connecting…</span></span></header>
<main><nav id="curator-find"><input id="curator-search" type="search" placeholder="find: book, section, class, concept…" aria-label="Find"><input id="curator-query" type="search" placeholder="?s must:pay ?o . ?s subject executor" aria-label="Pattern query" title="Statements matching every pattern, joined by ' . ': ?s <p> <o> — p: subject, must, must-not, may, presumed, force:action, ?p; o: a concept name prefix or ?o"><div id="curator-toc"></div></nav><div id="curator" aria-label="Live curation tree"></div><aside id="curator-panel" aria-live="polite"></aside></main>
<script src="/kotlin/spacegraph/spacegraph.js" defer></script>
</body>
</html>
