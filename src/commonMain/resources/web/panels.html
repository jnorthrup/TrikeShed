/* ── minimap: world overview + click-to-jump ───────────────────────────── */
const mm=$("#minimap"), mmx=mm.getContext("2d");
function drawMinimap(){
  mmx.clearRect(0,0,168,112);
  // fractal containment: one inset frame per dive level — the crumb, drawn.
  // The innermost frame holds the current level's world overview.
  const depth=diveStack.length;
  for(let i=0;i<=depth;i++){
    const ins=2+i*5;
    mmx.strokeStyle=i===depth?"#b07aff":"#232a38";
    mmx.strokeRect(ins+.5,ins+.5,168-2*ins-1,112-2*ins-1);
  }
  // ring children live in ring-local coordinates — bounds over top level only
  const tops=G.nodes.filter(n=>!n._parentScope&&n.el);
  if(!tops.length) return;
  const pad0=2+depth*5+3;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const n of tops){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+200); maxY=Math.max(maxY,n.y+120); }
  const pad=40, s=Math.min((168-2*pad0)/(maxX-minX+2*pad), (112-2*pad0)/(maxY-minY+2*pad));
  const ox=pad0-(minX-pad)*s, oy=pad0-(minY-pad)*s;
  for(const n of tops){
    mmx.fillStyle = n.el.classList.contains("err") ? "#ff4f58" : n.el.classList.contains("ok") ? "#3ddc84" : "#7b8496";
    mmx.fillRect(n.x*s+ox, n.y*s+oy, Math.max(3,180*s), Math.max(2,80*s));
  }
  const vw=viewport.clientWidth/view.z, vh=viewport.clientHeight/view.z;
  mmx.strokeStyle="#f29111"; mmx.lineWidth=1;
  mmx.strokeRect((-view.x/view.z)*s+ox, (-view.y/view.z)*s+oy, vw*s, vh*s);
  mm._s=s; mm._ox=ox; mm._oy=oy;
}
mm.addEventListener("click",e=>{
  if(!mm._s) return;
  const r=mm.getBoundingClientRect();
  const wx=((e.clientX-r.left)-mm._ox)/mm._s, wy=((e.clientY-r.top)-mm._oy)/mm._s;
  view.x=-(wx*view.z)+viewport.clientWidth/2; view.y=-(wy*view.z)+viewport.clientHeight/2;
  applyView(); save(); drawMinimap();
});
setInterval(drawMinimap, 1500);

/* ── persistence ───────────────────────────────────────────────────────── */
/* the tree survives the round trip: top level = nodes outside any ring;
   a ring emits its children recursively (the same objects that live
   flattened in G.nodes — one identity, no shadow copy) */
function nodeDoc(n){ return {id:n.id,type:n.type,x:n.x,y:n.y,params:n.params,collapsed:!!n.collapsed,subprogram:n.subprogram||undefined,
  children:(n.children&&n.children.length)?n.children.map(nodeDoc):undefined}; }
function serialize(){ return {view,nodes:G.nodes.filter(n=>!n._parentScope).map(nodeDoc),wires:G.wires,seq:G.seq}; }
let AUTOSAVE=true; // ?load= link views are ephemeral — never clobber the scratch
function save(){
  // History first: a ?load= view is ephemeral for the SCRATCH, but a person
  // poking at it still gets to back out. Undo is not autosave.
  recordHistory(JSON.stringify(serialize()));
  refreshRdf();
  if(!AUTOSAVE) return;
  try{ localStorage.setItem("trikeshed.panels.v3", JSON.stringify(serialize())); }catch(e){}
}
/* ── undo / redo ────────────────────────────────────────────────────────
   Taking over a canned demo means being able to back out of every change:
   load a preset, cut a cable, retype a param, dive into a ring — and step
   back. Every mutation already funnels through save(), so history records
   the TRANSITION there; no call site has to remember to snapshot. A burst of
   keystrokes in one field collapses into a single step (same node/wire shape
   inside 600ms), so undo walks edits, not characters. */
const UNDO=[],REDO=[],UNDO_MAX=200;
let restoring=false,lastDoc=null,lastPushMs=0;
function shapeKey(o){
  return (o.nodes||[]).map(n=>n.id+":"+n.type).join(",")+"|"+
         (o.wires||[]).map(w=>w.from+">"+w.to).join(",");
}
function recordHistory(cur){
  if(restoring||lastDoc===null||lastDoc===cur){ lastDoc=cur; histButtons(); return; }
  const now=Date.now();
  let sameShape=false;
  try{ sameShape=UNDO.length>0&&shapeKey(JSON.parse(lastDoc))===shapeKey(JSON.parse(cur)); }catch(e){}
  if(!(sameShape&&now-lastPushMs<600)){
    UNDO.push(lastDoc); if(UNDO.length>UNDO_MAX) UNDO.shift();
    lastPushMs=now;
  }
  REDO.length=0; lastDoc=cur; histButtons();
}
function histButtons(){
  const u=$("#undoBtn"),r=$("#redoBtn");
  if(u){ u.disabled=!UNDO.length; u.title="undo ("+UNDO.length+") ⌘Z"; }
  if(r){ r.disabled=!REDO.length; r.title="redo ("+REDO.length+") ⇧⌘Z"; }
}
function applyDoc(json){
  restoring=true;
  try{ load(JSON.parse(json)); lastDoc=JSON.stringify(serialize()); }
  finally{ restoring=false; }
  if(AUTOSAVE){ try{ localStorage.setItem("trikeshed.panels.v3", lastDoc); }catch(e){} }
  histButtons(); runAll();
}
function undo(){
  if(!UNDO.length){ $("#status").textContent="nothing to undo"; return; }
  REDO.push(lastDoc); applyDoc(UNDO.pop());
  $("#status").textContent="undo · "+UNDO.length+" step"+(UNDO.length===1?"":"s")+" back";
}
function redo(){
  if(!REDO.length){ $("#status").textContent="nothing to redo"; return; }
  UNDO.push(lastDoc); applyDoc(REDO.pop());
  $("#status").textContent="redo · "+REDO.length+" ahead";
}
addEventListener("keydown",e=>{
  const t=e.target,tag=((t&&t.tagName)||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||(t&&t.isContentEditable)) return;
  // Bare F frames the board — checked before the modifier gate below, which
  // exists for the undo/redo pair.
  if((e.key==="f"||e.key==="F")&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); fitToContent(); return; }
  if(!(e.metaKey||e.ctrlKey)) return;
  if(e.key==="z"||e.key==="Z"){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
  else if(e.key==="y"||e.key==="Y"){ e.preventDefault(); redo(); }
});
function load(data){
  for(const n of G.nodes){ if(n._timer)clearInterval(n._timer); if(n._es){n._es.close();n._es=null;} n.el.remove(); }
  G={nodes:[],wires:[],seq:data.seq||1};
  if(data.view) view=data.view;
  // three passes: CLONE the tree (children stay the SAME objects that get
  // flattened into G.nodes — serialize and the dive stack rely on that
  // identity), BUILD every node, then MOUNT children inside their ring
  // squares — the concentric pass.
  const cloneNode=sn=>({...sn,params:{...sn.params},children:(sn.children||[]).map(cloneNode)});
  const built=[];
  for(const sn of data.nodes||[]){
    if(!CONTRACTS[sn.type])continue;
    const n=cloneNode(sn);
    buildNode(n); built.push(n);
    // nested children become real graph citizens (wires, warm base, save)
    // but live inside the scope's childgrid — the ring owns their geometry
    const flatten=(node)=>{
      for(const c of (node.children||[])){
        if(!CONTRACTS[c.type])continue;
        buildNode(c); built.push(c);
        flatten(c);
      }
    };
    flatten(n);
  }
  G.nodes=built;
  mountChildren();
  G.wires=(data.wires||[]).filter(w=>G.nodes.find(n=>n.id===w.from[0])&&G.nodes.find(n=>n.id===w.to[0]));
  const bad=G.wires.filter(w=>!wireKindOk(w)).length;
  if(bad) $("#status").textContent=bad+" kind-unsafe cable"+(bad>1?"s":"")+" (red, dashed) — they feed nothing until reconnected";
  applyView(); redraw(); save();
}

/* ── the PALETTE: docked drag-source. Types are the served vocabulary
   (grouped by family — scope's coroutine rings, vm sub-VMs, kanban,
   blackboard, beliefs… — hover shows every port with its KIND); programs
   are the gallery (presets + store). Drag onto the canvas — or into a
   ring — to place; click a type to add at view center; click a program

async function buildPalette(){
  const pal=$("#palette"); pal.innerHTML="";

  const body=document.createElement("div"); pal.appendChild(body);
  let progs=[];

      fetch("/api/panels/presets").then(r=>r.json()).catch(()=>({presets:[]})),
      fetch("/api/panels").then(r=>r.json()).catch(()=>({panels:[]})),
    ]);
    progs=(pr.presets||[]).map(x=>x.name).concat((st.panels||[]).map(x=>x.name));
  }catch(_){}
  const render=f=>{
    body.innerHTML="";
    const groups={};
    for(const t of Object.keys(CONTRACTS).sort()){
      if(f&&!t.includes(f)&&!CONTRACTS[t].title.toLowerCase().includes(f))continue;
      const g=t.includes(".")?t.split(".")[0]:"core";

        d.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/x-lcnc-type",t); e.dataTransfer.effectAllowed="copy"; });
        d.addEventListener("click",()=>{ addNode(t,(viewport.clientWidth/2-view.x)/view.z,(viewport.clientHeight/2-view.y)/view.z); });
        body.appendChild(d);
      }
    }
    if(progs.length){
      const h=document.createElement("h5"); h.textContent="gallery — programs"; body.appendChild(h);
      for(const nm of progs){
        if(f&&!nm.toLowerCase().includes(f))continue;
        const d=document.createElement("div"); d.className="pitem"; d.draggable=true;

        d.addEventListener("click",()=>{ location.href="/panels?load="+enc(nm); });
        body.appendChild(d);
      }
    }
  };
  q.addEventListener("input",()=>render(q.value.trim().toLowerCase()));
  render("");
}

/* ── preset gallery: /api/panels/presets finally has its consumer ────────
   Server-shape (LcncProgramConfix) → client-shape converter + a picklist of
   presets and stored programs. Presets are OFFERED — loading one puts it on
   the canvas; installing stays the explicit ⇪ store act. */
function fromConfix(doc){
  // Server wires are {from:[node,port],to:[node,port]} (LcncProgramConfix.toJson);
  // accept the flat fromNode/fromPort spelling too so older documents still load.
  // children map RECURSIVELY — a preset's rings land concentric, never flattened.
  const nodeOf=n=>({id:n.id,type:n.type,x:n.x||0,y:n.y||0,params:n.params||{},collapsed:!!n.collapsed,subprogram:n.subprogram||undefined,
    children:(n.children&&n.children.length)?n.children.map(nodeOf):undefined});
  return {view:doc.view?{x:doc.view.x||0,y:doc.view.y||0,z:doc.view.z||doc.view.zoom||1}:undefined, seq:doc.seq||1,
    nodes:(doc.nodes||[]).map(nodeOf),
    wires:(doc.wires||[]).map(w=>({from:w.from||[w.fromNode,w.fromPort],to:w.to||[w.toNode,w.toPort]}))};
}
async function openGallery(){
  let g=$("#gallery");

  g.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:8px"><b style="color:var(--cyan,#57d3ff)">GALLERY</b><span style="cursor:pointer" onclick="this.closest(\'#gallery\').remove()">✕</span></div><div id="galBody">loading…</div>';
  document.body.appendChild(g);
  const body=g.querySelector("#galBody");
  try{
    const [pr,st]=await Promise.all([
      fetch("/api/panels/presets").then(r=>r.json()).catch(()=>({presets:[]})),
      fetch("/api/panels").then(r=>r.json()).catch(()=>({panels:[]})),
    ]);
    const rows=[];
    const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    /* Two groups, and the order is the whole point. A preset that needs a
       provider key is not a worse example — it is a DIFFERENT PROMISE, and
       putting it first means a person's first click can fail for reasons that
       have nothing to do with this canvas. The ones that run on nothing go
       first, and the rest are honestly labelled rather than hidden. */
    const needsKey=p=>/provider key|model provider/i.test(p.needs||"");
    const all=pr.presets||[];
    const card=p=>{
      const nn=((p.document||{}).nodes||[]).length;
      return '<div class="galRow" data-kind="preset" data-name="'+p.name+'" style="padding:7px 8px;border:1px solid var(--line,#263348);border-radius:6px;margin:5px 0;cursor:pointer">'+
        '<div style="font-weight:600">'+esc(p.title||p.name)+' <span style="color:var(--dim,#7f91a9);font-weight:400">· '+nn+' parts</span></div>'+
        (p.does?'<div style="margin-top:3px">'+esc(p.does)+'</div>':'')+
        (p.needs?'<div style="margin-top:3px;color:var(--dim,#7f91a9)"><b>needs</b> '+esc(p.needs)+'</div>':'')+
        (p.see?'<div style="color:var(--dim,#7f91a9)"><b>you see</b> '+esc(p.see)+'</div>':'')+
        (p.tweakFirst?'<div style="color:var(--dim,#7f91a9)"><b>change first</b> '+esc(p.tweakFirst)+'</div>':'')+
        '</div>';
    };
    const free=all.filter(p=>!needsKey(p)), keyed=all.filter(needsKey);
    rows.push('<div style="color:var(--ok,#3ddc84);margin:4px 0;font-weight:600">runs now · nothing to set up</div>');
    for(const p of free) rows.push(card(p));
    if(keyed.length){
      rows.push('<div style="color:var(--warn,#ffb02e);margin:12px 0 2px;font-weight:600">needs a provider key</div>');
      rows.push('<div style="color:var(--dim,#7f91a9);margin:0 0 4px">These call a model. If none of your keys answer, that is the provider, '+
        'not the canvas — the daemon records every attempt in <code>brain-errors.jsonl</code>.</div>');
      for(const p of keyed) rows.push(card(p));
    }
    rows.push('<div style="color:var(--dim,#7f91a9);margin:8px 0 4px">store — your saved programs</div>');
    const panels=st.panels||[];
    if(!panels.length) rows.push('<div style="color:var(--dim,#7f91a9)">store has no programs yet — ⇪ store saves the canvas</div>');
    for(const s of panels){
      rows.push('<div class="galRow" data-kind="store" data-name="'+s.name+'" style="padding:5px 6px;border:1px solid var(--line,#263348);border-radius:5px;margin:3px 0;cursor:pointer">'+s.name+' <span style="color:var(--dim,#7f91a9)">· '+(s.bytes||0)+' B</span></div>');
    }
    body.innerHTML=rows.join("");
    body.querySelectorAll(".galRow").forEach(el=>el.addEventListener("click",async()=>{
      const name=el.dataset.name;
      if(el.dataset.kind==="preset"){
        const hit=(pr.presets||[]).find(x=>x.name===name), doc=hit&&hit.document;
        if(doc){
          load(fromConfix(doc)); $("#panelName").value=name.replace(/^preset-/,""); syncBoard(name);
          // Land on the on-ramp, not on jargon: say what to change, and that
          // backing out is safe. ⇪ store keeps it; it is offered, not installed.
          $("#status").textContent=(hit.title||name)+" loaded — change first: "+
            (hit.tweakFirst||"anything")+" · ⌘Z undoes · ⇪ store keeps it";
        }
      } else {
        const resp=await fetch("/api/panels/"+name);
        if(resp.ok){ load(await resp.json()); $("#panelName").value=name; $("#status").textContent="loaded panels/"+name; syncBoard(name); }
      }
      g.remove(); armSources(); runAll();
    }));
  }catch(e){ body.textContent="gallery failed: "+e; }
}

/* ── RDF mapping interface ──────────────────────────────────────────────
   The canvas as triples (LcncRdf.graph, server-side, never authored here), the
   vocabulary as triples (LcncRdf.ontology), and the ALIGNMENT: the same IRIs
   joined against the Rete productions watching them, the causal rules that
   mention them, and the KIF facts about them. Turtle in the box is editable and

function toConfix(){ const d=serialize(); return {name:($("#panelName").value||"canvas"),nodes:d.nodes,wires:d.wires,view:{x:view.x,y:view.y,z:view.z}}; }
let RDF_TIMER=null, RDF_NOTE="";

async function rdfTab(tab){
  const g=$("#rdfPanel"); if(!g) return; g.dataset.tab=tab;
  g.querySelectorAll("[data-rt]").forEach(b=>b.style.borderColor=b.dataset.rt===tab?"var(--cyan,#57d3ff)":"var(--line,#263348)");
  const body=g.querySelector("#rdfBody"); const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  try{
    if(tab==="graph"||tab==="ontology"){
      const r= tab==="graph"
        ? await fetch("/api/lcnc/rdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(toConfix())})
        : await fetch("/api/lcnc/rdf");
      const ttl=await r.text();
      const n=(ttl.match(/ \.\s*$/gm)||[]).length;
      body.innerHTML='<div style="color:var(--dim,#7f91a9);margin:0 0 6px">'+n+' triples · '+(tab==="graph"?'this canvas, ports as resources, one <code>lcnc:feeds</code> per cable':'the vocabulary: node types, kinds, rdfs:subClassOf, in/out ports')+'</div>'
        +'<textarea id="rdfText" spellcheck="false" style="width:100%;height:46vh;font:11px/1.35 var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px;white-space:pre">'+esc(ttl)+'</textarea>'
        +'<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'
        +(tab==="graph"?'<button data-ra="apply" title="map the Turtle in the box back onto the canvas">⇲ apply to canvas</button><button data-ra="nal" title="ingest the causal projection: every cable becomes an implication belief">→ NAL beliefs</button>':'')
        +'<button data-ra="copy">copy</button></div><div id="rdfMsg" style="color:var(--dim,#7f91a9);margin-top:6px">'+esc(RDF_NOTE)+'</div>';
      RDF_NOTE="";
      body.querySelectorAll("[data-ra]").forEach(b=>b.addEventListener("click",async()=>{
        const msg=body.querySelector("#rdfMsg"); const ttl2=body.querySelector("#rdfText").value;
        if(b.dataset.ra==="copy"){ try{ await navigator.clipboard.writeText(ttl2); msg.textContent="copied"; }catch(e){ msg.textContent="copy failed: "+e; } }
        else if(b.dataset.ra==="apply"){
          const rr=await fetch("/api/lcnc/rdf/program",{method:"POST",headers:{"Content-Type":"text/turtle"},body:ttl2});
          const doc=await rr.json();
          if(!rr.ok||doc.error){ msg.textContent="apply refused: "+(doc.error||rr.status); return; }
          // load() re-renders this tab (debounced), which would erase the message; park it for that render.
          RDF_NOTE="canvas rebuilt from "+((doc.nodes||[]).length)+" nodes, "+((doc.wires||[]).length)+" cables";
          load(fromConfix(doc)); save(); armSources(); msg.textContent=RDF_NOTE; }
        else if(b.dataset.ra==="nal"){
          const al=await fetch("/api/lcnc/rdf/align",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(toConfix())}).then(r=>r.json());
          const rr=await fetch("/api/beliefs/kg",{method:"POST",headers:{"Content-Type":"text/turtle"},body:al.nal||""});
          const res=await rr.json();
          msg.textContent=rr.ok?("minted "+res.minted+" beliefs from "+res.statements+" statements · copulas "+JSON.stringify(res.copulas||{})):("NAL refused: "+(res.error||rr.status)); }
      }));
    } else {
      const al=await fetch("/api/lcnc/rdf/align",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(toConfix())}).then(r=>r.json());
      if(al.error){ body.textContent="align failed: "+al.error; return; }
      const rows=['<div style="color:var(--dim,#7f91a9);margin:0 0 6px">'+al.summary+'</div>'];
      for(const n of (al.nodes||[])){
        rows.push('<div class="rdfNode" data-id="'+esc(n.id)+'" style="padding:6px 8px;border:1px solid var(--line,#263348);border-radius:6px;margin:5px 0;cursor:pointer">'
          +'<div><b>'+esc(n.id)+'</b> <span style="color:var(--dim)">a</span> '+esc(n.type)+'</div>'
          +(n.watchedBy.length?'<div style="margin-top:3px"><span style="color:var(--warn,#ffb02e)">productions</span> '+n.watchedBy.map(esc).join(", ")+'</div>':'<div style="margin-top:3px;color:var(--dim)">no production watches it</div>')
          +(n.causalRules.length?'<div style="margin-top:3px"><span style="color:var(--ok,#3ddc84)">causal rules</span><br>'+n.causalRules.map(esc).join("<br>")+'</div>':'')
          +(n.facts.length?'<div style="margin-top:3px"><span style="color:var(--cyan,#57d3ff)">facts</span><br>'+n.facts.map(esc).join("<br>")+'</div>':'')
          +(n.feeds.length?'<div style="margin-top:3px;color:var(--dim)">causes → '+n.feeds.map(esc).join(", ")+'</div>':'')
          +'</div>');
      }
      if(al.firings&&al.firings.length){ rows.push('<div style="color:var(--dim,#7f91a9);margin:8px 0 2px">recent causal firings</div>'); for(const f of al.firings) rows.push('<div style="font-size:11px">'+esc(f)+'</div>'); }
      body.innerHTML=rows.join("");
      body.querySelectorAll(".rdfNode").forEach(el=>el.addEventListener("click",()=>{ const n=G.nodes.find(x=>x.id===el.dataset.id); if(!n) return; n.el.style.outline="2px solid var(--cyan,#57d3ff)"; setTimeout(()=>n.el.style.outline="",1200); }));
    }
  }catch(e){ body.textContent="rdf failed: "+e; }
}

/* ── contract hydration: the vocabulary is server-owned ─────────────────── */
// The ONE author is /api/lcnc/contracts; this page carries no type table.
// (This function was promised by the step-4 rework and never written — the
// boot awaited an undefined name, the IIFE died on the ReferenceError, and
// /panels rendered 100% empty. The vocabulary map is rebuilt here, verbatim
// from the served contracts: title/inputs/outputs/params/source/sink/wide.)
let CONTRACTS={}, KIND_ACCEPTANCE={}, KIND_REFINEMENTS=[], KIND_HIERARCHY=[];
/* THE BLACKBOARD: the vocabulary is an entry (lcnc/vocabulary) and programs are
   entries (lcnc/program/<name>), cables typed. A delta on the vocabulary entry
   re-hydrates the palette from what is on the board; the surface does not have
   to show a cable's type, it must obey it, and the board is where it is obeyed. */
(function(){
  try{
    const es=new EventSource("/blackboard/facts");
    es.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d&&d.key==="lcnc/vocabulary") syncContracts().then(()=>buildPalette()); }catch(_){} };
  }catch(_){}
})();
async function syncContracts(){
  try{
    const payload=await (await fetch('/api/lcnc/contracts')).json();
    const list=payload.contracts||[];
    KIND_ACCEPTANCE=payload.kindAcceptance||{};
    KIND_REFINEMENTS=payload.kindRefinements||[];
    KIND_HIERARCHY=payload.kindHierarchy||[];
    const m={};
    for(const c of list){
      // Normalize wire shape → renderer shape: the page reads ins/outs, and an
      // EMPTY opts array must not become a select (|| [] is truthy).
      c.ins=c.inputs||[]; c.outs=c.outputs||[];
      const p={};
      for(const k in (c.params||{})){
        const d=c.params[k]||{};
        p[k]={v:d.v??"", opts:(d.opts&&d.opts.length)?d.opts:undefined,
              optsFrom:d.optsFrom||undefined,
              ta:d.ta||undefined, ph:d.ph||undefined,
              cols:(d.cols&&d.cols.length)?d.cols:undefined};
      }
      c.params=p;
      m[c.type]=c;
    }
    CONTRACTS=m;
    // Fallback parity: every hydrated type with no explicit browser runner
    // dispatches to the daemon — explicit RUNNERS entries keep winning.
    for(const t in m) if(!RUNNERS[t]) RUNNERS[t]=serverRun(t);
    // result.confirm is a SINK whose server runner answers with a ready HTML
    // card (x). Sinks skip setResult by design (they own their own body), so
    // without a render hook the card the preset promises never appeared and the
    // answer stayed buried in prompt.chat's output tree.
    if(RUNNERS["result.confirm"]&&!RUNNERS["result.confirm"].render){
      RUNNERS["result.confirm"].render=(n,out)=>{
        const html=out&&typeof out.x==="string"?out.x:"";
        let el=n.el.querySelector(".result");
        if(!el){ el=document.createElement("div"); el.className="result"; n.el.appendChild(el);
          el.addEventListener("pointerdown",e=>e.stopPropagation()); }
        el.innerHTML=html;   // server-authored; content/error are escaped there
      };
    }
    $("#status").textContent=Object.keys(m).length+" contracts · "+Object.keys(KIND_ACCEPTANCE).length+" semantic kinds · "+KIND_HIERARCHY.length+" rdfs:subClassOf edges";
  }catch(e){
    $("#status").textContent="contracts fetch failed: "+e;
  }
}
/* ── boot: restore, or seed the starter panel ──────────────────────────── */
// Boot waits for contract hydration: the vocabulary is server-owned, and the
// starter board's addNode calls must see it or the first paint is empty.
(async()=>{ await Promise.all([syncContracts(),syncLanes()]);
buildPalette(); $("#palette").classList.add("open");
if(new URLSearchParams(location.search).get("dlg")==="keys") openKeyMuxDlg();
// /panels?load=<name> IS a link to a document: presets first, then the
// store. Link views are ephemeral — the localStorage scratch stays put.
const qload=new URLSearchParams(location.search).get("load");
if(qload){
  AUTOSAVE=false;
  try{
    const pr=await(await fetch("/api/panels/presets")).json();
    const hit=(pr.presets||[]).find(x=>x.name===qload||x.name==="preset-"+qload);
    if(hit&&hit.document){ load(fromConfix(hit.document)); $("#panelName").value=hit.name.replace(/^preset-/,""); $("#status").textContent="viewing "+hit.name+" — link view, ⇪ store to keep changes"; syncBoard(hit.name); }
    else{
      const resp=await fetch("/api/panels/"+enc(qload));
      if(resp.ok){ load(await resp.json()); $("#panelName").value=qload; syncBoard(qload); }
      else $("#status").textContent="no such program: "+qload;
    }
  }catch(e){ $("#status").textContent="link load failed: "+e; }
}
else{
let stored=null; try{ stored=JSON.parse(localStorage.getItem("trikeshed.panels.v3")); }catch(e){}
if(stored&&stored.nodes&&stored.nodes.length){ load(stored); }
else {
  /* the default construction is the PRODUCTION OPS BOARD: live system state,
     not an aspirational plan. timer drives; every column is a real surface. */
  const t=addNode("timer",30,60,{seconds:"10"});
  const v=addNode("graal.vitals",250,30);
  const pk=addNode("pick",470,30,{path:"memory.heapUsed"});
  const g=addNode("gauge",650,20,{label:"heap used"});
  const pk2=addNode("pick",470,180,{path:"gc.collections"});
  const g2=addNode("gauge",650,170,{label:"gc collections"});
  const sc=addNode("project.list",250,330);
  const scd=addNode("display",470,330);
  const bi=addNode("beliefs.introspect",250,520);
  const bid=addNode("display",470,520);
  const vs=addNode("vms.list",250,700);
  const vsd=addNode("display",470,700);
  const ks=addNode("keys.status",250,880);
  const ksd=addNode("display",470,880);
  // ── kanban: not a node, a COMPOSITION — now on the atomic vocabulary.
  // kanban.activeSheets (ONE server projection) feeds the concentric
  // treesheets AND the draggable gesture surface; a drop only DESCRIBES the
  // gesture, js shapes it, kanban.move (the daemon's own runner) lands it on
  // the WAL. Same composition offered as "preset-kanban" (▤ presets).
  const kas=addNode("kanban.activeSheets",30,1060);
  const ksc=addNode("sheet.concentric",300,1030);
  const bpi=addNode("pick",300,1430,{path:"items"});
  const bpc=addNode("pick",300,1570,{path:"columns"});
  const bgb=addNode("list.groupBy",520,1430,{key:"status"});
  const bdb=addNode("dom.board",740,1430,{idField:"id",titleField:"title",subtitleField:"id",badgeField:"priority"});
  const bmv=addNode("js",1460,1430,{expr:"{jobId:x.itemId,toColumn:x.to,expectedRevision:x.item.revision,idempotencyKey:'panel-'+x.itemId+'-'+x.item.revision+'-'+x.to}"});
  const bkm=addNode("kanban.move",1680,1430);
  const bks=addNode("kanban.submit",30,1430,{jobId:"",title:"",priority:"2",idempotencyKey:""});
  // ── continents: the heap treemap and the quota-legion standings live on
  // the same canvas as everything else — one zoom grammar, no side pages.
  const hp=addNode("graal.heap",250,1760,{lane:"allocation"});
  const ms=addNode("mux.standings",250,2000);
  const nt=addNode("note",650,340,{text:"production ops board — live planes, no fiction.\nright-click/double-click: add nodes.\ndrop a folder anywhere: mount it as a scope.\nkanban below: concentric treesheets (click ▤ refs to\ndive, crumb climbs out) + draggable board — a drop\nonly DESCRIBES the gesture; js + kanban.move decide.\nkanban.submit: fill params, ▶ — a real card lands.\nfurther down: heap continent + quota legion."});
  for(const [a,b,ap,bp] of [
    [t,v,"tick","trigger?"],[v,pk,"json","x"],[pk,g,"y","x"],
    [v,pk2,"json","x"],[pk2,g2,"y","x"],
    [t,sc,"tick","trigger?"],[sc,scd,"scopes","x"],
    [t,bi,"tick","trigger?"],[bi,bid,"field","x"],
    [t,vs,"tick","trigger?"],[vs,vsd,"rows","x"],
    [t,ks,"tick","trigger?"],[ks,ksd,"roster","x"],
    [t,kas,"tick","trigger?"],
    [kas,ksc,"board","board"],[kas,ksc,"byStatus","byStatus?"],
    [kas,ksc,"byPriority","byPriority?"],[kas,ksc,"orchestration","orchestration?"],
    [kas,bpi,"boardView","x"],[kas,bpc,"boardView","x"],
    [bpi,bgb,"y","x"],
    [bgb,bdb,"groups","groups"],[bpc,bdb,"y","columns?"],
    [bdb,bmv,"move","x"],[bmv,bkm,"y","command?"],
    [t,hp,"tick","trigger?"],
    [t,ms,"tick","trigger?"],
  ]) G.wires.push({from:[a.id,ap],to:[b.id,bp]});
  save();
}
}
applyView(); requestAnimationFrame(redraw);
// arm sources and run once immediately — a freshly loaded panel shows LIVE
// state on first paint, not an inert diagram waiting for a click.
armSources();
runAll();
})();
