<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construction Panels</title>
<style>
/* Committed single-theme: the same dark ops console as /graal. */
:root{
  --bg:#0c0f15; --panel:#131824; --panel2:#1a2130; --line:#262e3e; --ink:#e3e7ef; --dim:#8b94a7;
  --graal:#f29111; --ok:#3ddc84; --err:#ff5560; --warn:#ffb02e; --wire:#3fd0ff; --vm:#b07aff; --cpu:#6ea8fe;
  /* UI speaks the SYSTEM sans (no named families — a local novelty font
     aliasing "Inter" etc. must never leak in); DATA stays mono */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Berkeley Mono","IBM Plex Mono","Cascadia Code","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
#bar{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,rgba(11,14,20,.97),rgba(11,14,20,.88));border-bottom:1px solid var(--line);z-index:20}
#bar b{color:var(--graal);letter-spacing:.03em;margin-right:6px}
#bar .sub{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--graal)}
button.run{border-color:var(--ok);color:var(--ok)}
button.stop{border-color:var(--err);color:var(--err)}
#status{margin-left:auto;color:var(--dim);font-size:11px}
#viewport{position:absolute;inset:40px 0 0 0;overflow:hidden;cursor:grab}
#viewport.panning{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
#wires{position:absolute;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke-width:2.2;pointer-events:stroke;cursor:pointer}
#wires path.live{stroke:var(--wire)}
#wires path.drag{stroke:var(--graal);stroke-dasharray:6 4}
#wires path.mismatch{stroke:var(--err)!important;stroke-dasharray:4 5;opacity:.85}
#wires path.refused{stroke:var(--err)!important;stroke-dasharray:6 4;opacity:.9}
#wires text.wiretype{font:9px var(--mono);fill:var(--dim);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
#wires text.wiretype.refused{fill:var(--err)}
/* candidate splines: the cable you WOULD get, drawn to every legal spot while
   one is in hand. pointer-events:none is not optional — #wires path is
   clickable (that is how a cable is cut), and a fan of ghosts would eat the
   drop. */
#wires path.cand{stroke-width:1.4;opacity:.30;stroke-dasharray:3 6;pointer-events:none}
#wires path.cand.near{stroke-width:2.4;opacity:.85;stroke-dasharray:5 4}
/* refused by containment, not by kind — visible so the impedance is legible,
   dimmer and violet so it never reads as an offer */
#wires path.cand.blocked{stroke:var(--vm)!important;opacity:.20;stroke-dasharray:1 6}
/* the shake resolved to one: this is not a candidate any more, it is the
   answer, so it stops looking provisional */
#wires path.cand.only{stroke-width:2.8;opacity:1;stroke-dasharray:none;
  filter:drop-shadow(0 0 5px currentColor);animation:wireflow .5s linear infinite}
#wires path.cand.only{stroke-dasharray:8 6}
@media (prefers-reduced-motion:reduce){ #wires path.cand.only{animation:none;stroke-dasharray:none} }
#wires path:hover{stroke:var(--err)}
.node{position:absolute;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.node .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;background:var(--panel2);cursor:move}
.node .hd i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.node.running .hd i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.node.ok .hd i{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
.node.err .hd i{background:var(--err);box-shadow:0 0 8px rgba(255,79,88,.6)}
.node .hd b{font-size:12px;flex:1;white-space:nowrap}
.node .hd s{color:var(--dim);cursor:pointer;text-decoration:none;padding:0 3px}
.node .hd s:hover{color:var(--err)}
.node .body{padding:6px 0}
.row{position:relative;display:flex;align-items:center;min-height:20px;padding:1px 12px;font-size:11px}
.row.in{justify-content:flex-start;color:var(--ink)}
.row.out{justify-content:flex-end;color:var(--ink)}
.port{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;border:2px solid var(--wire);background:var(--bg);transform:translateY(-50%);cursor:crosshair;z-index:2}
.row.in .port{left:-6px}
.row.out .port{right:-6px}
.port:hover{background:var(--wire)}
.params{padding:2px 8px 6px;display:flex;flex-direction:column;gap:4px}
.params label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.params input,.params textarea,.params select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:3px;font:11px/1.4 inherit;padding:3px 5px;width:100%;user-select:text}
.params textarea{resize:both;min-height:44px;white-space:pre}
.result{margin:0 8px 6px;padding:5px 6px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-size:10px;color:var(--dim);max-height:150px;max-width:340px;overflow:auto;white-space:pre;user-select:text;resize:both}
.node.wide{min-width:680px}
.kboard{display:flex;gap:6px;padding:6px 8px 8px;overflow-x:auto}
.kcol{flex:0 0 132px;background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:60px;padding:5px;transition:outline .1s}
.kcol.over{border-color:var(--err)}
.kcol.dragover{outline:2px dashed var(--graal);outline-offset:-2px}
.kcol h6{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);display:flex;justify-content:space-between;margin:0 0 5px;font-weight:400}
.kcol h6 b{color:var(--ink);font-weight:600}
.kcol.over h6 b{color:var(--err)}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 6px;margin-bottom:5px;font-size:10.5px;line-height:1.35;cursor:grab;user-select:none}
.kcard:active{cursor:grabbing;opacity:.6}
.kcard.contested{border-color:var(--err);box-shadow:0 0 0 1px rgba(255,79,88,.3)}
.kcard .kid{color:var(--dim);font-size:9px}
.kboard-status{padding:2px 10px 8px;font-size:9px;color:var(--dim)}
.ctree{white-space:pre;font-size:10px;line-height:1.5;user-select:text}
.ctree-tw{display:inline-block;width:10px;color:#7b8496}
.gaugeval{margin:2px 8px 8px;font-size:26px;font-variant-numeric:tabular-nums;color:var(--graal);text-align:center}
#menu{position:fixed;display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:30;min-width:190px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#menu h5{padding:5px 10px 3px;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
#menu div.item{padding:6px 12px 6px 10px;cursor:pointer;font-size:12px;
  border-left:3px solid transparent;line-height:1.35}
#menu div.item:hover,#menu div.item.sel{background:var(--panel2);border-left-color:var(--graal)}
/* one flat concatenated string was unscannable: the type, the port it lands
   on, and the prose all read at the same weight. */
#menu div.item .ty{color:var(--ink);font-weight:600}
#menu div.item .pt{color:var(--wire)}
#menu div.item .ti{display:block;color:var(--dim);font-family:var(--sans);font-size:11px}
#menu div.item:hover .ty{color:var(--graal)}
#hint{position:fixed;bottom:8px;left:10px;color:var(--dim);font-size:10px;z-index:20}
/* ── ComfyUI-grade affordances ── */
#wires path.live.flow{stroke-dasharray:8 6;animation:wireflow .5s linear infinite}
@keyframes wireflow{to{stroke-dashoffset:-14}}
/* `color` as well as border-color: the wiring glow below is drawn in
   currentColor, which inherited the node's TEXT colour and rendered a grey
   halo on every port regardless of kind. Setting color here is what makes a
   mateable json port glow json-cyan instead of dishwater. */
.port.t-text{border-color:#6ea8fe;color:#6ea8fe}.port.t-json{border-color:#3fd0ff;color:#3fd0ff}
.port.t-id{border-color:#b07aff;color:#b07aff}
.port.t-num{border-color:#ffb02e;color:#ffb02e}.port.t-trig{border-color:#3ddc84;color:#3ddc84}
.port.t-text:hover{background:#6ea8fe}.port.t-json:hover{background:#3fd0ff}.port.t-id:hover{background:#b07aff}
.port.t-num:hover{background:#ffb02e}.port.t-trig:hover{background:#3ddc84}
.node.collapsed .params,.node.collapsed .result,.node.collapsed .gaugeval,.node.collapsed .gaugelabel,.node.collapsed .kboard,.node.collapsed .kboard-status{display:none}
.node.note{background:#2a2410;border-color:#5c4d1a;min-width:150px}
/* Reading-width for what a person reads: notes and the answer card. */
.node[data-type="note"]{min-width:330px}
.node[data-type="result.confirm"]{min-width:360px}
.node[data-type="result.confirm"] .result pre{font-size:13px}
.node.note .hd{background:#33290f}
#minimap{position:fixed;right:10px;bottom:26px;width:168px;height:112px;background:rgba(17,21,30,.92);border:1px solid var(--line);border-radius:5px;z-index:20;cursor:pointer}
/* ── fractal zoom: diving into a program.ref swaps the SAME viewport to its
   real sub-graph — the RTS camera going from strategic to tactical, not a
   flat function call. #crumb is the way back up, one level per dive. ── */
#crumb{position:fixed;top:40px;left:0;right:0;height:26px;display:flex;align-items:center;gap:4px;padding:0 10px;background:rgba(11,14,20,.94);border-bottom:1px solid var(--line);z-index:19;font-size:11px;color:var(--dim)}
#crumb span.seg{cursor:pointer;color:var(--wire)}
#crumb span.seg:hover{color:var(--graal);text-decoration:underline}
#crumb span.sep{color:var(--dim)}
.node.ref{border-color:var(--vm)}
.node.ref .hd{background:linear-gradient(90deg,var(--panel2),rgba(176,122,255,.12))}
.ref-dive{margin:0 8px 8px;padding:5px 8px;background:var(--bg);border:1px dashed var(--vm);border-radius:3px;font-size:10px;color:var(--vm);cursor:pointer;text-align:center}
.ref-dive:hover{background:rgba(176,122,255,.1)}
/* clickable treesheet leaves — this was the whole complaint: a JSON tree you
   can only expand/collapse is a viewer, not a tool. Click a leaf, get its
   value; click a panel-name leaf inside a panels.list result, get a node. */
.ctree span.leaf{cursor:pointer;border-bottom:1px dotted transparent}
.ctree span.leaf:hover{border-bottom-color:currentColor}
.ctree span.leaf.copied{color:var(--ok)!important}
#menu input{width:calc(100% - 16px);margin:6px 8px 4px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:3px;font:inherit;padding:3px 6px}
#menu .items{max-height:300px;overflow-y:auto}
/* ── concentric treesheets + standings tables ── */
.csheet{margin:0 8px 8px;font-size:10.5px;user-select:text}
.csheet .crumbrow{margin:2px 0 4px;color:var(--dim)}
.csheet .seg{cursor:pointer;color:var(--wire)}
.csheet .seg:hover{color:var(--graal);text-decoration:underline}
.csheet .seg.here{color:var(--ink);cursor:default;text-decoration:none}
.csheet .ringrow{margin:2px 0 4px}
.csheet .ringrow.orch{color:var(--dim);font-size:9.5px}
.csheet .tablewrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:3px}
.csheet table{border-collapse:collapse;width:100%}
.csheet th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:400;text-transform:uppercase;font-size:8.5px;letter-spacing:.05em;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
.csheet td{padding:2px 6px;border-bottom:1px solid rgba(35,42,56,.5);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.csheet td.leafcell{cursor:pointer}
.csheet td.leafcell:hover{color:var(--graal)}
.csheet td.leafcell.copied{color:var(--ok)}
.dagchip{display:inline-block;background:var(--panel2);border:1px solid var(--vm);color:var(--vm);border-radius:3px;padding:0 5px;margin:1px 2px;cursor:pointer;font-size:9.5px}
.dagchip:hover{background:rgba(176,122,255,.15)}
.dagchip i{color:var(--dim);font-style:normal}
.utilbar{display:inline-block;width:64px;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:2px;vertical-align:middle}
.utilbar i{display:block;height:100%;background:var(--warn)}
/* ── fractal concentric: rings, CCEK swimlane spine, seed/emit IO ── */
/* CONCENTRIC CONTEXT: a scope node IS its ring — a hard-cornered square whose
   child nodes live INSIDE it at inset margins. Nesting of scope squares is the
   withContext(LcncScopeFrame) chain itself: outer square = enclosing ring,
   inner squares = child rings, nearest-ring-wins on shadowing. Children are
   placed at polar angles inside the parent square — inner margin grows with
   depth, so rings never crowd; margins absorb growth by construction.
   This is the machine's own geometry (LcncRunner.runRing / LcncScopeFrame),
   not a wrapper decoration. */
.node.scope{background:transparent;border:1.5px solid var(--vm);min-width:0;box-shadow:none}
.node.scope>.hd{background:transparent;border-bottom:1px dashed rgba(176,122,255,.35);cursor:move}
.node.scope>.hd b{color:var(--vm)}
.node.scope>.ringlbl{position:absolute;top:-9px;left:10px;background:var(--bg);border:1px solid var(--vm);
  color:var(--vm);font-size:8.5px;padding:0 6px;line-height:15px;white-space:nowrap}
.node.scope>.ringlbl i{font-style:normal;color:var(--dim)}
.node.scope.collapsed{min-width:140px;min-height:34px}
.node.scope.collapsed .body,.node.scope.collapsed .params,.node.scope.collapsed .result{display:none}
/* the ring's window: a clipping viewport onto its own microscopic canvas.
   Drag the header to move it, grab the corner to resize it, WHEEL inside to
   zoom it, drag its empty interior to pan it — the same physics as the main
   screen, at every depth. */
.node.scope .childgrid{position:relative;min-height:60px;resize:both;overflow:hidden;cursor:grab}
.node.scope .childgrid:active{cursor:grabbing}
.ringworld{position:absolute;left:0;top:0;transform-origin:0 0}
/* a child inside a ring squares off against its siblings at inset margins */
.node.inring{border-color:rgba(176,122,255,.4)}
.node[data-lane]{border-top:2px solid var(--line)}
/* fractal IO: ◀ seed enters the left edge, emit ▶ leaves the right — the same
   grammar at node scale and ring scale (ConcentricSurface.RingBand). */
.node .seed,.node .emit{font-size:9px;color:var(--dim);padding:1px 8px;line-height:1.6;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .seed:empty,.node .emit:empty{display:none}
.node .seed::before{content:"◀ ";color:#3f5468}
.node .emit{text-align:right}
.node .emit::after{content:" ▶";color:#3f5468}
.node.scope>.seed{color:#6b8aa0}
.node.scope>.emit{color:#7a95a8}
/* the lane ruler: CCEK element families as a spine across the world's top */
/* ELASTIC concentric border: a lane is the BOX its members occupy, not a
   caption rail above them. It was `top:-30px;height:20px` with drawSpine only
   ever setting left/width, so the frame never enclosed anything and appeared
   to sit still while its interior moved. Now it stretches in both axes. */
#spine{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:0}
#spine .lane{position:absolute;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:9px;white-space:nowrap;background:rgba(255,255,255,.012)}
#spine .lane>b{position:absolute;top:-8px;left:10px;font-weight:400;background:var(--bg);padding:0 6px;line-height:16px;border-radius:4px}
.node{z-index:1}
/* untyped port: contract declared no kind — it mates with nothing */
.port.t-any{border-color:var(--dim)}
/* a picklist filled from a running source, not from a list someone typed */
.params select.live{border-color:var(--wire)}
.params select.live option[data-stale]{color:var(--warn)}
/* SHAPE is the second axis. Colour is already spoken for by KIND, so effect-ness
   gets shape: a circle is a transaction, a square CHANGES SOMETHING outside the
   graph. You can see, without reading a label, which cables end in a write. */
.port.fx{border-radius:2px}
.port.fx::before{content:"";position:absolute;inset:-3px;border-radius:3px;
  border:1px dashed currentColor;opacity:.45;pointer-events:none}
/* an outlet with nowhere to go — the yield cannot leave its ring */
.port.outletblocked{border-radius:2px;transform:translateY(-50%) rotate(45deg);
  border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb, var(--warn) 30%, transparent)}
/* wiring affordance: while a wire is in hand, only kind-equal ports stay lit;
   everything incompatible dims — the canvas itself states the options */
/* Wiring mode. Dimming the rest was never the problem — the highlight was.
   A 10px hollow dot with a 7px halo in the wrong colour is not a target, so
   a mateable port now FILLS with its kind colour, grows, and pulses. */
body.wiring .port{opacity:.22}
body.wiring .port.mateable{
  opacity:1;
  background:currentColor;
  border-color:currentColor;
  transform:translateY(-50%) scale(1.55);
  /* plain first, color-mix second: an engine without color-mix drops the
     second declaration and still gets a solid glow rather than none */
  box-shadow:0 0 12px 2px currentColor;
  box-shadow:0 0 0 3px color-mix(in srgb, currentColor 28%, transparent),
             0 0 14px 2px currentColor;
  animation:matepulse 1.15s ease-in-out infinite;
}
@keyframes matepulse{
  0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, currentColor 28%, transparent),
                     0 0 10px 1px currentColor}
  50%    {box-shadow:0 0 0 6px color-mix(in srgb, currentColor 14%, transparent),
                     0 0 18px 3px currentColor}
}
@media (prefers-reduced-motion:reduce){ body.wiring .port.mateable{animation:none} }
/* the sole survivor of the shake: brighter than a candidate, because it is
   what will happen if you simply let go */
/* THE SHAKE'S VERDICT, left on the board.
   Green/red alone would lie in both directions: a port with no mate on the
   whole board (add a node — nothing here can ever feed it) is a different
   problem from one that simply lost this pass or sat out of reach (move it
   closer, or shift-shake). Three states, because there are three answers. */
.port.v-ok{background:var(--ok)!important;border-color:var(--ok)!important}
.port.v-dead{background:var(--err)!important;border-color:var(--err)!important}
.port.v-open{background:var(--warn)!important;border-color:var(--warn)!important}
/* THE VERDICT LAYER. A 7px glyph inside a 10px socket is a footnote; a shake
   across a 98-node graph needs to be readable at the zoom you actually inspect
   a graph from. These are real verdicts — every mark is computed, none is
   decoration — but they are allowed to be loud about it, and they land one
   after another so a shake reads as a pass over the graph rather than a
   silent repaint. */
#verdicts{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
.vmark{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font:800 16px/1 var(--sans);transform:scale(0);
  animation:vpop .32s cubic-bezier(.2,1.7,.35,1) both}
@keyframes vpop{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  65%{transform:scale(1.3) rotate(5deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}}
.vmark.ok{background:var(--ok);color:#03210d;
  box-shadow:0 0 0 3px rgba(61,220,132,.22),0 0 18px 2px rgba(61,220,132,.5)}
.vmark.dead{background:var(--err);color:#2b0406;
  box-shadow:0 0 0 3px rgba(255,85,96,.22),0 0 18px 2px rgba(255,85,96,.55)}
.vmark.open{background:var(--warn);color:#2b1a00;
  box-shadow:0 0 0 3px rgba(255,176,46,.22),0 0 16px 2px rgba(255,176,46,.45)}
/* the unsolvable ones keep asking: nothing on the board can close them */
.vmark.dead::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2px solid var(--err);animation:vthrob 1.5s ease-out infinite}
@keyframes vthrob{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .vmark{animation-duration:.01s}
  .vmark.dead::after{animation:none;opacity:.5}}
/* STARVED REACH: a required input nobody feeds does not fail alone. Everything
   downstream of it runs on nothing and reports success — which is exactly how
   preset-context shipped a fold with no bullets and a green test suite. Show
   the dead reach, not just the origin. */
.node.starved{outline:1px dashed var(--err);outline-offset:2px}
.node.starved>.hd b{color:var(--err)}
#wires path.starved{stroke:var(--err)!important;opacity:.42;stroke-dasharray:2 7}
/* what the shake just closed, for a moment, so a whole-graph change is not a
   silent diff you have to hunt for */
@keyframes shookflash{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
.port.just-shook{border-color:var(--ok)!important;background:var(--ok)!important;animation:shookflash 1.4s ease-out}
body.wiring .port.mate-only{
  transform:translateY(-50%) scale(1.9);
  box-shadow:0 0 0 4px color-mix(in srgb, currentColor 40%, transparent),0 0 22px 4px currentColor;
  animation-duration:.7s;
}
/* the node that owns a live target earns a rim, so you can find it before you
   go hunting for the dot */
body.wiring .node:has(.port.mateable){box-shadow:0 0 0 1px color-mix(in srgb, var(--wire) 55%, transparent)}
body.wiring .node.nomate{opacity:.3;filter:saturate(.25)}
/* the kind matches, the ring refuses — the failure that had no appearance */
body.wiring .port.scopeblock{opacity:.75;border-color:var(--vm);background:transparent;
  box-shadow:0 0 0 2px color-mix(in srgb, var(--vm) 30%, transparent)}
.port.v-scope{background:var(--vm)!important;border-color:var(--vm)!important}
.vmark.scope{background:var(--vm);color:#1a0b2e;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--vm) 22%, transparent),0 0 16px 2px color-mix(in srgb, var(--vm) 50%, transparent)}

<script>
"use strict";
/* ── registry of node types: each speaks a REAL daemon surface ─────────── */
/* ── RUNNERS: execution bodies ONLY. The node VOCABULARY — titles, ports,
   kinds, cardinality, param defaults, source/sink/wide flags — is authored
   ONCE in Kotlin (LcncContracts) and hydrated at boot from
   /api/lcnc/contracts. This file carries NO type table; RouteParityGate
   fails the build if one reappears. A runner without a server contract is
   dead code and surfaces in the console at boot. */
const RUNNERS = {
  "vm.spawn": {
    async run(n){
      const b={id:p(n,"id"),facet:p(n,"facet"),wallMillis:+p(n,"wallMillis")};
      const w=p(n,"world").split(",").map(s=>s.trim()).filter(Boolean); if(w.length)b.world=w;
      const r=await api("POST","/api/vm/spawn",b);
      if(r.error && !String(r.error).includes("exists")) throw r.error;
      return {vmId:r.id||b.id};
    },
  },
  "vm.eval": {
    async run(n,i){
      const src = i["source?"]!==undefined ? String(i["source?"]) : p(n,"source");
      const r=await api("POST","/api/vm/"+enc(i.vmId)+"/eval",{source:src,name:"panel"});
      if(r.error) throw r.error;
      return {value:r.value,cid:r.cid};
    },
  },
  "vm.revoke": {
    async run(n,i){ const r=await api("POST","/api/vm/"+enc(i.vmId)+"/revoke",{}); return {ok:!r.error}; },
  },
  "vms.list": {
    async run(){ const r=await api("GET","/api/vm"); return {rows:r.rows||r}; },
  },
  "pytest.pure": {
    async run(n,i){
      const flags=p(n,"flags").split(/\s+/).filter(Boolean).map(f=>JSON.stringify(f)).join(",");
      const src=`import sys, io, __future__, importlib.machinery
sys.path[:0]=['/workspace/puresite','/workspace/computronium']
class FutureLoader(importlib.machinery.SourceFileLoader):
    def source_to_code(self, data, path, *, _optimize=-1):
        flags = __future__.annotations.compiler_flag if str(path).startswith('/workspace/computronium') else 0
        return compile(data, path, 'exec', flags=flags, dont_inherit=True, optimize=_optimize)
sys.path_hooks.insert(0, importlib.machinery.FileFinder.path_hook((FutureLoader, importlib.machinery.SOURCE_SUFFIXES)))
sys.path_importer_cache.clear()
import typing, typing_extensions as te
for _n in dir(te):
    if not _n.startswith('_') and not hasattr(typing, _n):
        try: setattr(typing, _n, getattr(te, _n))
        except Exception: pass
import pytest
buf = io.StringIO(); old=(sys.stdout,sys.stderr); sys.stdout=sys.stderr=buf
try:
    rc = pytest.main([${flags}, ${JSON.stringify(p(n,"path"))}])
finally:
    sys.stdout,sys.stderr = old
(rc, buf.getvalue()[-2000:])`;
      const r=await api("POST","/api/vm/"+enc(i.vmId)+"/eval",{source:src,name:"panel-pytest"});
      if(r.error) throw r.error;
      return {exit:r.value&&r.value[0],tail:r.value&&r.value[1]};
    },
  },
  "graal.vitals": {
    async run(){ return {json:await api("GET","/api/graal/vitals")}; },
  },
  "blackboard.facts": {
    async run(){ return {facts:await api("GET","/blackboard/facts")}; },
  },
  "blackboard.board": {
    async run(){ return {board:await api("GET","/blackboard/board")}; },
  },
  "blackboard.sites": {
    async run(){ return {sites:await api("GET","/blackboard/sites")}; },
  },
  "http.get": {
    async run(n){ return {json:await api("GET",p(n,"path"))}; },
  },
  "http.post": {
    async run(n,i){ return {json:await api("POST",p(n,"path"),i.body)}; },
  },
  "board.get": {
    async run(){ return {json:await api("GET","/api/board")}; },
  },
  "timer": {
    async run(n){ return {tick:Date.now()}; },
  },
  "js": {
    async run(n,i){ const f=new Function("x","return ("+p(n,"expr")+")"); return {y:f(i.x)}; },
  },
  "pick": {
    async run(n,i){ let v=i.x; for(const k of p(n,"path").split(".").filter(Boolean)) v=v?.[k]; return {y:v}; },
  },
  "display": {
    async run(n,i){ setResult(n, i.x); return {}; },
  },
  "gauge": {
    async run(n,i){
      let v=i.x; if(typeof v==="number"&&v>9999) v=(v/1e6).toFixed(1)+"M";
      n.el.querySelector(".gaugeval").textContent=String(v);
      n.el.querySelector(".gaugelabel").textContent=p(n,"label"); return {};
    },
  },
  "mux.chat": {
    async run(n,i){
      const body={prompt: i["prompt?"]!==undefined?String(i["prompt?"]):p(n,"prompt"), maxTokens:+p(n,"maxTokens"), temperature:+p(n,"temperature")};
      if(p(n,"system")) body.system=p(n,"system");
      // the seat's admissible key×model pairs ride the call
      let mlist; try{ mlist=JSON.parse(p(n,"models")||"[]"); }catch(_){ mlist=[]; }
      if(Array.isArray(mlist)&&mlist.length) body.models=mlist;
      const r=await api("POST","/api/mux/chat",body);
      if(r.verdict!=="ok") throw (r.detail||r.verdict||"mux error");
      return {content:r.content, model:r.model};
    },
  },
  // mux.models / keys.status have NO client twin: the server runners
  // (BrainMuxNodes, reached through serverRun) are the contract. The twins
  // that lived here read /api/mux/models (the brain's single pinned endpoint)
  // and /api/mux/keys (the static roster), so the canvas showed one model
  // where the picklist showed thirty-seven, and the `have` port never existed.
  "project.kill": {
    async run(n){
      const name=p(n,"name"); if(!name) throw "name required";
      const r=await api("DELETE","/api/projects/"+encodeURIComponent(name));
      return {verdict:r};
    },
  },
  "project.mount": {
    async run(n,i){
      const r=await api("POST","/api/projects",{path: i["path?"]!==undefined?String(i["path?"]):p(n,"path")});
      if(r.verdict!=="ok") throw (r.detail||"mount refused");
      return {scope:r};
    },
  },
  "project.list": {
    async run(){ const r=await api("GET","/api/projects"); return {scopes:r.scopes||r}; },
  },
  "kg.ingest": {
    async run(n,i){
      const body = i["text?"]!==undefined?String(i["text?"]):p(n,"kg");
      const resp = await fetch("/api/beliefs/kg",{method:"POST",headers:{"Content-Type":"text/turtle"},body});
      const r = JSON.parse(await resp.text());
      if(r.error) throw r.error;
      return {report:r};
    },
  },
  "beliefs.review": {
    async run(n,i){
      const r=await api("POST","/api/beliefs/review",{facts:i.facts, turnSucceeded:p(n,"turnSucceeded")==="true"});
      if(r.error) throw r.error;
      return {landed:r};
    },
  },
  "beliefs.resonate": {
    async run(n,i){
      const body={goal: i["goal?"]!==undefined?String(i["goal?"]):p(n,"goal"), k:+p(n,"k")};
      if(p(n,"taxonomy")) body.taxonomy=p(n,"taxonomy");
      if(p(n,"mode")==="whitened") body.mode="whitened";
      const r=await api("POST","/api/beliefs/resonate",body);
      if(r.error) throw r.error;
      return {synonyms:r.synonymPeaks, antonyms:r.antonymPeaks};
    },
  },
  "beliefs.introspect": {
    async run(){ const r=await api("GET","/api/beliefs/introspect"); return {field:r}; },
  },
  "pointcut.routes": {
    async run(){ const r=await api("GET","/api/graal/pointcuts"); return {routes:r.routes||r}; },
  },
  "board.view": {
    async run(){
      const r=await api("GET","/api/board");
      const cols=(r.columns||[]).map(c=>c.id+":"+(c.count!=null?c.count:"?")+(c.wipLimit?"/"+c.wipLimit:"")).join("  ");
      const items=r.items||[];
      const contested=items.filter(x=>x.contested).map(x=>x.id);
      const wipAlerts=(r.columns||[]).filter(c=>c.wipLimit&&c.count>c.wipLimit).map(c=>"WIP "+c.id+" "+c.count+"/"+c.wipLimit);
      return {board:{seq:r.sequence,cols:cols,cards:items.length},
              alerts:{contested:contested,wip:wipAlerts}};
    },
  },
  "list.pairs": {
    async run(n){ let a; try{ a=JSON.parse(p(n,"pairs")||"[]"); }catch(_){ a=[]; } return {pairs:Array.isArray(a)?a:[]}; },
  },
  "list.groupBy": {
    async run(n,i){
      const key=p(n,"key"); const out={};
      for(const item of (i.x||[])){
        let v=item; for(const k of key.split(".").filter(Boolean)) v=v?.[k];
        const g=String(v); (out[g]=out[g]||[]).push(item);
      }
      return {groups:out};
    },
  },
  "dom.board": {
    async run(n,i){
      n._groups=i.groups||{}; n._cols=i["columns?"]||null;
      // Event semantics: a drag gesture fires downstream exactly once; no gesture
      // emits NOTHING (undefined skips required inputs — `move: null` crashed the
      // js node's expr on every timer tick before any drag happened).
      const mv=n._lastMove; n._lastMove=null;
      return mv?{move:mv}:{};
    },
    render(n){ renderGroupedBoard(n); },
  },
  "panels.list": {
    async run(){ const r=await api("GET","/api/panels"); return {panels:r.panels||[]}; },
    render(n,out){ renderPanelsList(n,out&&out.panels||[]); },
  },
  "program.ref": {
    async run(){ return {}; },
    render(n){ renderProgramRef(n); },
  },
  "scope.in": {
    // at canvas top level a formal parameter has no caller: its declared
    // default IS the value (rings consume it through the frame chain)
    async run(n){ return {value:p(n,"default")}; },
  },
  "scope.out": {
    async run(n,i){ setResult(n, i.value); return {}; },
  },
  "scope": {
    // The ring executes IN the daemon — withContext(LcncScopeFrame) nesting,
    // the CCEK landing. The browser posts the ring (a named stored program,
    // or its children as an inline document), paints the returned warm base
    // onto the bands, and emits the gathered returns. Rings hold
    // daemon-runnable types only: a client-only type inside throws
    // LcncUnknownNodeType daemon-side and lands here as the ring's error.
    async run(n,i){
      const guard=i["when?"];
      if(guard===false||guard==="false") return {};
      const args=(i["args?"]&&typeof i["args?"]==="object")?i["args?"]:{};
      const named=p(n,"program");
      const descIds=new Set(); (function walk(m){ for(const c of (m.children||[])){ descIds.add(c.id); walk(c); } })(n);
      // inward wires are the warm base (data flows lateral or inward — the
      // daemon's own rule): a source OUTSIDE the ring is replicated into the
      // posted document as a scope.in carrying its already-computed value
      const intra=G.wires.filter(w=>descIds.has(w.from[0])&&descIds.has(w.to[0])&&wireKindOk(w));
      const inbound=G.wires.filter(w=>!descIds.has(w.from[0])&&descIds.has(w.to[0])&&w.from[0]!==n.id&&wireKindOk(w));
      const synth=[], synthWires=[], seen=new Set();
      for(const w of inbound){
        const key=w.from[0]+"·"+w.from[1];
        if(!seen.has(key)){
          seen.add(key);
          const src=G.nodes.find(x=>x.id===w.from[0]);
          let v=src&&src._lastOut?src._lastOut[w.from[1]]:undefined;
          if(v===undefined)continue;
          if(typeof v==="object")v=JSON.stringify(v);
          synth.push({id:key,type:"scope.in",params:{name:"__in_"+key,default:String(v)}});
        }
        synthWires.push({from:[key,"value"],to:w.to});
      }
      const body=named?{program:named,inputs:args}
        :{name:(($("#panelName").value||"ring")+":"+n.id),
          document:{nodes:synth.concat((n.children||[]).map(nodeDoc)),
                    wires:intra.concat(synthWires)},
          inputs:args};
      const r=await api("POST","/api/lcnc/run",body);
      if(r.ok!==true) throw (r.error||"ring run failed");
      for(const c of (n.children||[])){          // the warm base lands on the bands
        const out=r.outputs&&r.outputs[c.id];
        if(out!==undefined&&c.el){
          c.el.classList.remove("err","running"); c.el.classList.add("ok");
          if(out&&Object.keys(out).length) setResult(c,out);
        }
      }
      // daemon shape: a ring's outputs are its yields PLUS the composed map
      return {...(r.returns||{}), returns:r.returns||{}};
    },
  },
  "note": {
    async run(){ return {}; },
  },
  "text.value": {
    async run(n){ return {value:p(n,"value")}; },
  },
  "json.value": {
    async run(n){
      const raw=(p(n,"value")||"").trim();
      if(!raw) return {value:[]};
      try{ return {value:JSON.parse(raw)}; }
      catch(e){ return {error:"json.value: not valid json"}; }
    },
  },
  "button": {
    // press is an EDGE: it exists on the run its click fired, then it's gone
    async run(n){ const t=n._pressedAt; n._pressedAt=null; return t?{press:t}:{}; },
    render(n){ renderButtonNode(n); },
  },
  "slider": {
    async run(n){ return {value:+(n._sval??p(n,"value")??0)}; },
    render(n){ renderSliderNode(n); },
  },
  "media.player": {
    // every control is a PATCH POINT: url on a text wire, play/stop/rewind
    // as trigger signals, `ended` firing downstream when playback finishes
    async run(n,i){
      const url=String(i.url);
      const m=ensureMedia(n,url);
      if(m.getAttribute("data-src")!==url){ m.setAttribute("data-src",url); m.src=url; }
      if(i["volume?"]!==undefined) m.volume=Math.max(0,Math.min(1,+i["volume?"]||0));
      if(i["rewind?"]!==undefined) m.currentTime=0;
      if(i["stop?"]!==undefined) m.pause();
      if(i["play?"]!==undefined){ try{ await m.play(); }catch(e){ setResult(n,"autoplay blocked — press the element's ▶ once"); } }
      const fired=n._endedAt; n._endedAt=null;
      const out={state:{url,playing:!m.paused,t:Math.round(m.currentTime*10)/10,duration:isFinite(m.duration)?Math.round(m.duration*10)/10:0}};
      if(fired) out.ended=fired;
      return out;
    },
  },
  "graal.events": {
    async run(n){ return {event:n._lastEvent||null}; },
  },
  "vm.events": {
    async run(n){ return {event:n._lastEvent||null}; },
  },
  "sheet.concentric": {
    // The concentric treesheet view: board sheet at the center, partitions one
    // ring out, orchestration outermost. State is an id→sheet index; SheetRef
    // cells ({sheet:"id"}) and child rings drill in, the crumb climbs out.
    async run(n,i){
      const idx={}, add=s=>{ if(s&&s.id) idx[s.id]=s; };
      add(i.board);
      for(const s of (i["byStatus?"]||[])) add(s);
      for(const s of (i["byPriority?"]||[])) add(s);
      n._sheets=idx; n._orch=i["orchestration?"]||null;
      if(!n._cur||!idx[n._cur]) n._cur=i.board&&i.board.id;
      return {};
    },
    render(n){ renderConcentric(n); },
  },
  "graal.heap": {
    async run(n){ const r=await api("GET","/api/graal/heap"); n._heap=r; return {heap:r}; },
    render(n){ renderHeap(n); },
  },
  "mux.standings": {
    async run(n){ const r=await api("GET","/api/mux/standings"); n._standings=(r&&r.standings)||[]; return {standings:n._standings}; },
    render(n){ renderStandings(n); },
  },
};
/* ── server-family runners: ONE author of execution semantics. The daemon runs
   the node (POST /api/lcnc/run against the composed lcncRunners registry — the
   same map webhook dispatch resolves); the browser posts params+inputs and
   renders the outputs. Installed by syncContracts() for EVERY hydrated
   contract type without an explicit browser runner above, so a registered
   daemon lego is never inert on the canvas. */
function serverRun(type){
  return { async run(n,i){
    const r=await api("POST","/api/lcnc/run",{type:type,params:n.params||{},inputs:i});
    if(r.ok!==true) throw (r.error||("lcnc run failed: "+type));
    return r.outputs||{};
  }};
}

/* ── graph state ───────────────────────────────────────────────────────── */
let G={nodes:[],wires:[],seq:1};              // wires: {from:[nodeId,port], to:[nodeId,port]}
let view={x:60,y:60,z:1};
const $=s=>document.querySelector(s), world=$("#world"), wiresSvg=$("#wires"), viewport=$("#viewport");
const enc=encodeURIComponent;
function p(n,k){ return n.params[k]; }
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body!==undefined&&method!=="GET"?JSON.stringify(body):undefined});
  const t=await r.text(); try{ return JSON.parse(t); }catch(e){ return {raw:t,status:r.status}; }
}
/* cursor-tree widget: collapsible tree rendering of any JSON doc */
function renderTree(v,key,depth){
  const d=document.createElement("div"); d.className="ctree";
  if(depth>0) d.style.marginLeft="10px";
  const isObj=v!==null&&typeof v==="object";
  // every value drags OUT of a result tree — drop it into a list widget,
  // a param field, or anything else that accepts object values
  const asDrag=(el2,val)=>{ el2.draggable=true; el2.addEventListener("dragstart",e=>{
    e.stopPropagation(); e.dataTransfer.setData("text/x-lcnc-value",JSON.stringify(val)); e.dataTransfer.effectAllowed="copy"; }); };
  if(!isObj){
    const s=document.createElement("span"); s.className="leaf"; asDrag(s,v);
    s.textContent=(key?key+": ":"")+(typeof v==="string"?'"'+v+'"':String(v));
    if(v===null) s.style.color="#b07aff"; else if(typeof v==="number") s.style.color="#ffb02e"; else if(typeof v==="string") s.style.color="#3ddc84";
    s.title="click to copy this value";
    s.addEventListener("click",e=>{
      e.stopPropagation();
      copyText(String(v));
      s.classList.add("copied"); setTimeout(()=>s.classList.remove("copied"),500);
    });
    d.appendChild(s); return d;
  }
  const arr=Array.isArray(v), entries=arr?v.map((x,i)=>[i,x]):Object.entries(v);
  let open=depth<2; // let, not const: the toggle below reassigns it
  const tw=document.createElement("span"); tw.className="ctree-tw"; tw.textContent=open?"▾":"▸";
  const lb=document.createElement("span"); lb.textContent=key?(key+": "+(arr?`[${entries.length}]`:`{${entries.length}}`)):(arr?`Array[${entries.length}]`:`Object{${entries.length}}`);
  const hd=document.createElement("span"); hd.append(tw,lb); asDrag(hd,v);
  const kids=document.createElement("div");
  for(const [k,val] of entries) kids.appendChild(renderTree(val,String(k),depth+1));
  const sync=()=>{ kids.style.display=open?"":"none"; tw.textContent=open?"▾":"▸"; };
  sync();
  hd.style.cursor="pointer"; hd.onclick=()=>{ open=!open; sync(); };
  d.append(hd,kids); return d;
}
function setResult(n,v){
  let el=n.el.querySelector(".result");
  if(!el){ el=document.createElement("div"); el.className="result"; n.el.appendChild(el);
    // resizing/selecting a result pane must not bleed into a canvas pan
    el.addEventListener("pointerdown",e=>e.stopPropagation()); }
  // JSON docs render as a cursor-tree; strings stay verbatim
  if(v!==null&&typeof v==="object"){ el.textContent=""; el.appendChild(renderTree(v,"",0)); }
  else el.textContent = typeof v==="string" ? v : String(v);
}
/* ── generic grouped/draggable board renderer — the ONE piece of this
   composition that is unavoidably code, because SOME primitive has to touch
   the DOM. It carries zero domain vocabulary: no kanban, no /api/invoke, no
   "revision" or "committed". A drop only DESCRIBES the gesture — {itemId,
   item, from, to} — on the node's `move` output; what that gesture MEANS is
   entirely the wired graph's business (a `js` node shapes the command, an
   `http.post` node fires it — see the "kanban" saved program). This same
   node composes a CRM pipeline, a triage queue, a sprint board: whatever the
   graph downstream of `move` decides to do with the gesture. */
function renderGroupedBoard(n){
  const groups=n._groups||{}, meta=n._cols;
  const idF=p(n,"idField"), titleF=p(n,"titleField"), subF=p(n,"subtitleField"), badgeF=p(n,"badgeField");
  const cols = meta && meta.length ? meta : Object.keys(groups).sort().map(k=>({id:k,name:k}));
  let wrap=n.el.querySelector(".kboard");
  if(!wrap){ wrap=document.createElement("div"); wrap.className="kboard"; n.el.appendChild(wrap); }
  let status=n.el.querySelector(".kboard-status");
  if(!status){ status=document.createElement("div"); status.className="kboard-status"; n.el.appendChild(status); }
  wrap.textContent="";
  const total=Object.values(groups).reduce((a,g)=>a+g.length,0);
  status.textContent=total+" items across "+cols.length+" groups";
  for(const col of cols){
    const items=(groups[col.id]||[]).slice().sort((a,b)=>((a&&a.order)??0)-((b&&b.order)??0));
    const over=col.wipLimit&&items.length>col.wipLimit;
    const c=document.createElement("div"); c.className="kcol"+(over?" over":"");
    c.dataset.group=col.id;
    const h=document.createElement("h6");
    h.innerHTML=`<span>${col.name||col.id}</span><b>${items.length}${col.wipLimit?"/"+col.wipLimit:""}</b>`;
    const plus=document.createElement("s"); plus.textContent="＋"; plus.title="new card (modal — kanban.submit)";
    plus.style.cssText="cursor:pointer;color:var(--ok);text-decoration:none;margin-left:6px";
    plus.addEventListener("pointerdown",e=>e.stopPropagation());
    plus.addEventListener("click",e=>{ e.stopPropagation(); openCardModal(n,col.id,null); });
    h.appendChild(plus);
    c.appendChild(h);
    for(const it of items){
      const card=document.createElement("div");
      card.className="kcard"+(it.contested?" contested":"");
      card.dataset.jobid=it[idF];
      card.style.touchAction="none"; // pointer drag streams moves on touch too
      const title=it[titleF]??it[idF]??"?", sub=it[subF], badge=it[badgeF];
      card.innerHTML=`<div>${title}</div><div class="kid">${sub!=null&&sub!==title?sub:""}${badge!=null?" · "+badge:""}</div>`;
      // Pointer-event drag, NOT HTML5 DnD: works for mouse/trackpad/touch/pen
      // alike, survives the canvas transform, and needs no dataTransfer.
      card.addEventListener("pointerdown",e=>{
        e.stopPropagation(); // don't pan the canvas while grabbing a card
        if(e.button!==0) return;
        const sx=e.clientX, sy=e.clientY; let ghost=null;
        const colUnder=ev=>{ const t=document.elementFromPoint(ev.clientX,ev.clientY); return t?t.closest(".kcol"):null; };
        const onMove=ev=>{
          if(!ghost){
            if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return; // click/dblclick stays intact
            const r=card.getBoundingClientRect();
            ghost=card.cloneNode(true);
            ghost.style.cssText=`position:fixed;pointer-events:none;z-index:999;opacity:.88;width:${r.width}px;margin:0`;
            document.body.appendChild(ghost);
            card.style.opacity=".35";
          }
          ghost.style.left=(ev.clientX+8)+"px"; ghost.style.top=(ev.clientY+8)+"px";
          wrap.querySelectorAll(".kcol").forEach(k=>k.classList.remove("dragover"));
          const kc=colUnder(ev); if(kc) kc.classList.add("dragover");
          ev.preventDefault();
        };
        const onUp=ev=>{
          window.removeEventListener("pointermove",onMove);
          window.removeEventListener("pointerup",onUp);
          window.removeEventListener("pointercancel",onUp);
          wrap.querySelectorAll(".kcol").forEach(k=>k.classList.remove("dragover"));
          card.style.opacity="";
          if(!ghost) return; // never crossed the threshold: plain click
          ghost.remove();
          const kc=colUnder(ev), to=kc&&kc.dataset.group;
          if(!to) return;
          // X and Y both mean something: the card whose top half the pointer is
          // above becomes the insert-before target; below every card = append.
          let beforeJobId=null;
          for(const el2 of kc.querySelectorAll(".kcard")){
            if(el2===card) continue;
            const r2=el2.getBoundingClientRect();
            if(ev.clientY<r2.top+r2.height/2){ beforeJobId=el2.dataset.jobid||null; break; }
          }
          if(to===col.id&&beforeJobId===null) return; // dropped back where it was
          // Optimistic local move AT the pointed position; the next activeSheets
          // tick reconciles truth (a refused move snaps it back).
          const fromArr=n._groups[col.id]||[], idx=fromArr.findIndex(x=>x[idF]===it[idF]);
          if(idx>=0){
            const moved=fromArr.splice(idx,1)[0];
            const dst=(n._groups[to]=n._groups[to]||[]);
            const at=beforeJobId?dst.findIndex(x=>x[idF]===beforeJobId):-1;
            if(at>=0) dst.splice(at,0,moved); else dst.push(moved);
            dst.forEach((x,i)=>{ if(x&&typeof x==="object") x.order=i; });
            renderGroupedBoard(n);
          }
          const st=n.el.querySelector(".kboard-status");
          if(st) st.textContent=it[idF]+": "+col.id+" → "+to+(beforeJobId?" (before "+beforeJobId+")":"")+" (downstream deciding…)";
          n._lastMove={itemId:it[idF],item:it,from:col.id,to,beforeJobId};
          runAll(n.id); // this node's own downstream chain sees the gesture
        };
        window.addEventListener("pointermove",onMove);
        window.addEventListener("pointerup",onUp);
        window.addEventListener("pointercancel",onUp);
      });
      card.addEventListener("dblclick",e=>{ e.stopPropagation(); openCardModal(n,col.id,it); }); // modal CRUD
      c.appendChild(card);
    }
    wrap.appendChild(c);
  }
}
/* ── concentric treesheets: the graal.html sheet-family renderer, made a node.
   Zero vocabulary: it renders exactly the {id,title,parent,columns,rows} sheets
   the server projected; a {sheet:"id"} cell is a drill-in; children rings are
   the sheets whose parent is the current one; the crumb is the way back out. */
function renderConcentric(n){
  let wrap=n.el.querySelector(".csheet");
  if(!wrap){ wrap=document.createElement("div"); wrap.className="csheet"; n.el.appendChild(wrap); }
  const idx=n._sheets||{}, cur=idx[n._cur];
  if(!cur){ wrap.innerHTML='<div class="kboard-status">no sheets yet — wire kanban.activeSheets in and run</div>'; return; }
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const crumb=[]; let c=cur, guard=0;
  while(c&&guard++<12){ crumb.unshift(c); c=c.parent?idx[c.parent]:null; }
  let html='<div class="crumbrow">'+crumb.map((s,i)=>
    '<span class="seg'+(i===crumb.length-1?' here':'')+'" data-sheet="'+esc(s.id)+'">'+esc(s.title||s.id)+'</span>'
  ).join(' ▸ ')+'</div>';
  const kids=Object.values(idx).filter(s=>s.parent===cur.id);
  if(kids.length) html+='<div class="ringrow">'+kids.map(s=>
    '<span class="dagchip" data-sheet="'+esc(s.id)+'">▤ '+esc(s.title||s.id)+' <i>'+(s.rows||[]).length+'</i></span>'
  ).join('')+'</div>';
  if(!(cur.rows||[]).length) html+='<div class="kboard-status">empty sheet — '+(cur.columns||[]).map(c=>esc(c.name)).join(' · ')+'</div>';
  else html+='<div class="tablewrap"><table><tr>'+(cur.columns||[]).map(c=>'<th title="'+esc(c.type||'')+'">'+esc(c.name)+'</th>').join('')+'</tr>'+
    cur.rows.map(row=>'<tr>'+row.map(cell=>{
      if(cell&&typeof cell==="object"&&cell.sheet){
        const child=idx[cell.sheet];
        return '<td><span class="dagchip" data-sheet="'+esc(cell.sheet)+'">▤ '+esc(child?(child.title||child.id):cell.sheet)+'</span></td>';
      }
      return '<td class="leafcell" title="click to copy">'+esc(cell==null?'':String(cell))+'</td>';
    }).join('')+'</tr>').join('')+'</table></div>';
  if(n._orch&&n._orch.lanes) html+='<div class="ringrow orch">'+
    (n._orch.lanes||[]).map(l=>'<span class="dagchip" title="'+esc(l.role||'')+'">'+esc(l.id)+'</span>').join('→')+
    ((n._orch.edges||[]).some(e=>e.mode&&e.mode!=="NORMAL")?' <i>'+(n._orch.edges||[]).filter(e=>e.mode&&e.mode!=="NORMAL").map(e=>esc(e.mode.toLowerCase())).join('·')+'</i>':'')+'</div>';
  wrap.innerHTML=html;
  wrap.querySelectorAll("[data-sheet]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation(); n._cur=el.dataset.sheet; renderConcentric(n);
  }));
  wrap.querySelectorAll(".leafcell").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation(); copyText(el.textContent);
    el.classList.add("copied"); setTimeout(()=>el.classList.remove("copied"),500);
  }));
  wrap.querySelectorAll("*").forEach(el=>el.addEventListener("pointerdown",e=>e.stopPropagation()));
}
/* ── heap continent: bytes-by-class as a slice-and-dice treemap off
   /api/graal/heap — lane param picks JFR allocation attribution or the
   jmap-style histogram when it has rows. */
function renderHeap(n){
  let cv=n.el.querySelector("canvas.heapmap");
  if(!cv){ cv=document.createElement("canvas"); cv.className="heapmap"; cv.width=664; cv.height=150;
    cv.style.cssText="display:block;margin:0 8px 4px;border:1px solid var(--line);border-radius:3px"; n.el.appendChild(cv);
    const st=document.createElement("div"); st.className="kboard-status heapstat"; n.el.appendChild(st); }
  const h=n._heap||{}, lane=p(n,"lane")||"allocation";
  const rows=(lane==="histogram"&&(h.rows||[]).length?h.rows:h.allocation)||[];
  const top=rows.slice().sort((a,b)=>(b.bytes||0)-(a.bytes||0)).slice(0,24);
  const total=top.reduce((a,r)=>a+(r.bytes||0),0);
  const x2=cv.getContext("2d"); x2.clearRect(0,0,cv.width,cv.height);
  const stat=n.el.querySelector(".heapstat");
  if(!total){ if(stat) stat.textContent="heap: no "+lane+" data yet"; return; }
  const hue=s=>{ let v=0; for(let i=0;i<s.length;i++) v=(v*31+s.charCodeAt(i))>>>0; return v%360; };
  // slice-and-dice: alternate axis each split, area ∝ bytes
  function tile(items,x,y,w,hgt,horiz){
    if(!items.length||w<1||hgt<1) return;
    if(items.length===1){
      const r=items[0];
      x2.fillStyle="hsl("+hue(r.class)+" 45% 32%)"; x2.fillRect(x+0.5,y+0.5,w-1,hgt-1);
      if(w>60&&hgt>12){ x2.fillStyle="#d8dce6"; x2.font="9px monospace";
        const short=r.class.replace(/^.*\./,"").slice(0,Math.floor(w/6));
        x2.fillText(short,x+3,y+10);
        if(hgt>24) x2.fillText((r.bytes/1048576).toFixed(1)+"M",x+3,y+21); }
      return;
    }
    const sum=items.reduce((a,r)=>a+r.bytes,0); let acc=0, cut=0;
    for(let i=0;i<items.length;i++){ acc+=items[i].bytes; if(acc>=sum/2){ cut=i+1; break; } }
    if(cut===0||cut===items.length) cut=Math.max(1,items.length>>1);
    const a=items.slice(0,cut), b=items.slice(cut), fa=a.reduce((s,r)=>s+r.bytes,0)/sum;
    if(horiz){ tile(a,x,y,Math.round(w*fa),hgt,!horiz); tile(b,x+Math.round(w*fa),y,w-Math.round(w*fa),hgt,!horiz); }
    else { tile(a,x,y,w,Math.round(hgt*fa),!horiz); tile(b,x,y+Math.round(hgt*fa),w,hgt-Math.round(hgt*fa),!horiz); }
  }
  tile(top,0,0,cv.width,cv.height,true);
  if(stat) stat.textContent=lane+": "+(total/1048576).toFixed(1)+"MB across top "+top.length+" classes"+
    (lane==="histogram"?" · "+(h.classes||0)+" classes "+((h.bytes||0)/1048576).toFixed(1)+"MB live":"");
}

/* the media element rides the node; audio vs video follows the url. The
   `ended` event is a live patch point — it re-fires the downstream chain. */
function ensureMedia(n,url){
  const isVideo=/\.(mp4|webm|mov|m4v|mkv)(\?|#|$)/i.test(url||"");
  const want=isVideo?"VIDEO":"AUDIO";
  if(n._media&&n._media.tagName!==want){ n._media.remove(); n._media=null; }
  if(!n._media){
    const m=document.createElement(isVideo?"video":"audio");
    m.controls=true; m.preload="metadata";
    m.style.cssText=isVideo?"display:block;width:100%;max-width:640px;margin:0 8px 8px;border-radius:6px;background:#000"
                           :"display:block;width:calc(100% - 16px);margin:0 8px 8px";
    m.addEventListener("pointerdown",e=>e.stopPropagation());
    m.addEventListener("ended",()=>{ n._endedAt=Date.now(); runAll(n.id); });
    n.el.appendChild(m); n._media=m;
  }
  return n._media;
}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).catch(()=>fallbackCopy(s)); }
  else fallbackCopy(s);
}
function fallbackCopy(s){
  const ta=document.createElement("textarea"); ta.value=s; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}
/* ── fractal dive: a program.ref node is not a function call, it is a
   window onto another graph living at the SAME zoom/pan surface this one
   does. Diving in swaps G for the referenced program and remembers how to
   get back — the RTS camera descending a level, not a black-box invocation.
   Because a dived-in graph can itself hold a program.ref, this recurses to
   whatever depth the stored programs actually nest. */
let diveStack=[]; // [{name, data}] — data is this level's serialize() before diving deeper
function crumbSync(){
  const el=$("#crumb");
  if(!diveStack.length){ el.style.display="none"; el.textContent=""; return; }
  el.style.display="flex";
  el.textContent="";
  const root=document.createElement("span"); root.className="seg"; root.textContent="⌂ root";
  root.addEventListener("click",()=>popTo(0));
  el.appendChild(root);
  diveStack.forEach((entry,i)=>{
    const sep=document.createElement("span"); sep.className="sep"; sep.textContent=" ▸ "; el.appendChild(sep);
    const seg=document.createElement("span"); seg.className="seg"; seg.textContent=entry.name;
    if(i<diveStack.length-1) seg.addEventListener("click",()=>popTo(i+1));
    else seg.style.color="var(--ink)";
    el.appendChild(seg);
  });
}
async function diveInto(name){
  const resp=await fetch("/api/panels/"+encodeURIComponent(name));
  if(!resp.ok){ $("#status").textContent="dive failed: no such program '"+name+"'"; return; }
  const data=await resp.json();
  diveStack.push({name,data:serialize()});
  crumbSync();
  $("#panelName").value=name;
  load(data);
  $("#status").textContent="diving into "+name+" — ⌂ root or a breadcrumb segment to climb back out";
  syncBoard(name);
}
function popTo(depth){
  if(depth>=diveStack.length) return;
  const target=diveStack[depth];
  diveStack=diveStack.slice(0,depth);
  crumbSync();
  $("#panelName").value=depth===0?"":diveStack[depth-1].name;
  load(target.data);
}

/* ── fractal concentric: CCEK swimlane lanes + ring nesting + minimap ──── */
// The machine's lanes: each node runs in one CCEK ring; the lane names the
// Key factory whose upstream coroutine state seeds the node and what it emits.
// HYDRATED from /api/lcnc/concentric (ConcentricSurface.LANE_ASSEMBLAGE, each
// lane derived from its RING_BANDS entry) — this page authors NO lane schema.
let LANES=[];
async function syncLanes(){
  try{

function removeNode(id){
  const n=G.nodes.find(n=>n.id===id); if(!n)return;
  // a ring takes its whole subtree with it — timers/SSE cleared per node,
  // and a removed child leaves its parent's children array (or serialize
  // would resurrect it on the next round trip)
  const drop=new Set(); (function collect(m){ drop.add(m.id); for(const c of (m.children||[])) collect(c); })(n);
  for(const m of G.nodes){
    if(!drop.has(m.id)) continue;
    if(m._timer){clearInterval(m._timer);m._timer=null;}
    if(m._es){m._es.close();m._es=null;}
  }
  const ps=n._parentScope;
  if(ps&&ps.children){ ps.children=ps.children.filter(c=>c.id!==n.id); refreshRingChrome(ps); layoutRing(topRingOf(ps)); resolveTopLevelOverlaps(); }
  n.el.remove();
  G.nodes=G.nodes.filter(x=>!drop.has(x.id));
  G.wires=G.wires.filter(w=>!drop.has(w.from[0])&&!drop.has(w.to[0]));
  redraw(); save();
}
/* ── wires ─────────────────────────────────────────────────────────────── */
function portCenter(nodeId,dir,name){
  const n=G.nodes.find(n=>n.id===nodeId); if(!n)return null;
  // a ring's DOM contains its children's ports — resolve the node's OWN port,
  // never a child's shadowing one (nested scopes share port names)
  let el=null;
  for(const cand of n.el.querySelectorAll(`.port[data-dir="${dir}"][data-port="${name}"]`)){
    if(cand.closest(".node")===n.el){ el=cand; break; }
  }
  if(!el)return null;
  const r=el.getBoundingClientRect(), w=world.getBoundingClientRect();
  return {x:(r.left+r.width/2-w.left)/view.z, y:(r.top+r.height/2-w.top)/view.z};
}
/* The wire backdrop's box, in world units. Grown, never shrunk mid-session, and
   only when something has actually escaped it — redraw() runs on every
   pointermove, so this must not measure the DOM: council is 98 nodes and
   getBoundingClientRect on each would put a forced reflow in the drag loop that
   the fixed box never had. Top-level node coordinates are already in hand, ring
   children are bounded by the ring node that holds them, and PAD absorbs the
   difference between a node's origin and its true extent. */
const WIRE_PAD=900;
let WIRE_BOX=null;
function growWireBox(pts){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of G.nodes){
    if(n._parentScope) continue;            // a child lives inside its ring's box
    const x=n.x||0,y=n.y||0;
    x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x+320); y1=Math.max(y1,y+220);
  }
  for(const p of pts){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  if(!isFinite(x0)){ x0=0;y0=0;x1=1200;y1=800; }
  x0-=WIRE_PAD; y0-=WIRE_PAD; x1+=WIRE_PAD; y1+=WIRE_PAD;
  const b=WIRE_BOX;
  if(b&&x0>=b.x&&y0>=b.y&&x1<=b.x+b.w&&y1<=b.y+b.h) return false;  // still fits
  const nx=b?Math.min(b.x,Math.floor(x0)):Math.floor(x0);
  const ny=b?Math.min(b.y,Math.floor(y0)):Math.floor(y0);
  const nx1=b?Math.max(b.x+b.w,Math.ceil(x1)):Math.ceil(x1);
  const ny1=b?Math.max(b.y+b.h,Math.ceil(y1)):Math.ceil(y1);
  WIRE_BOX={x:nx,y:ny,w:Math.max(1200,nx1-nx),h:Math.max(800,ny1-ny)};

function applyWireBox(){
  const b=WIRE_BOX; if(!b) return;
  wiresSvg.setAttribute("width",b.w); wiresSvg.setAttribute("height",b.h);
  wiresSvg.setAttribute("viewBox",b.x+" "+b.y+" "+b.w+" "+b.h);

function bez(a,b){ const dx=Math.max(40,Math.abs(b.x-a.x)/2); return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`; }
/* WHAT THE DAEMON OBEYS, SHOWN. The program on the canvas has an entry on the

let BOARD={name:null,cables:new Map(),violations:new Map()};

async function syncBoard(name){

    if(!resp.ok){ redraw(); return; }

function redraw(){

  // coordinates already in hand rather than a reflow per node.
  const ends=[];

    path.setAttribute("d",bez(a,b)); path.classList.add("live");

let dragWire=null;
/* FD PLACEMENT, ONCE.

   settles, it stops, and the result is a document you can still drag.

   POLARITY, so it happily parks a producer to the right of its consumer and
   every wire runs backwards. So x is LAYERED — longest path along the wires, a
   node sits one column right of everything feeding it — and only y is relaxed.
   Cables then flow left to right by construction; nothing spawns backwards.

   Rings take part as single boxes at their own measured size. That is the
   outer-scope-as-passive-projection reading: a ring does not get placed by its
   contents, it gets SIZED by them, and the size is what pushes its neighbours

function fdLayout(){
  const nodes=G.nodes.filter(n=>!n._parentScope&&n.el);
  if(nodes.length<2){ $("#status").textContent="fd: nothing to place"; return; }
  const idx=new Map(nodes.map((n,i)=>[n.id,i]));
  const topOf=id=>{ let m=G.nodes.find(x=>x.id===id); while(m&&m._parentScope) m=m._parentScope; return m; };
  const edges=[];
  for(const w of G.wires){
    const a=topOf(w.from[0]), b=topOf(w.to[0]);
    if(a&&b&&a!==b&&idx.has(a.id)&&idx.has(b.id)) edges.push([idx.get(a.id),idx.get(b.id)]);
  }
  // ── x: longest-path layering, so every cable points forward ──
  const layer=new Array(nodes.length).fill(0);
  for(let pass=0;pass<nodes.length;pass++){
    let moved=false;
    for(const [a,b] of edges) if(layer[b]<layer[a]+1){ layer[b]=layer[a]+1; moved=true; }
    if(!moved) break;                       // a cycle just stops improving
  }
  const size=n=>({w:(n.el.offsetWidth||220),h:(n.el.offsetHeight||120)});
  const COLGAP=90, ROWGAP=42;
  const byLayer=new Map();
  nodes.forEach((n,i)=>{ if(!byLayer.has(layer[i])) byLayer.set(layer[i],[]); byLayer.get(layer[i]).push(i); });

  // becomes an unreadable strip. Wrap a layer into as many sub-columns as its
  // own height demands: still the same layer, still left of everything it
  // feeds, just not a single tower.
  const MAXCOL=1800;

    const total=members.reduce((t,i)=>t+size(nodes[i]).h+ROWGAP,0);
    const parts=Math.max(1,Math.ceil(total/MAXCOL));
    const per=total/parts;
    const xs=[]; let run=0, k=0;
    for(const i of members){ sub[i]=Math.min(parts-1,k); run+=size(nodes[i]).h+ROWGAP;

  const preds=nodes.map(()=>[]), succs=nodes.map(()=>[]);

  nodes.forEach((n,i)=>{ const k=layer[i]+":"+sub[i]; if(!stacks.has(k)) stacks.set(k,[]); stacks.get(k).push(i); });

  // moved; fitting in the same tick measures the layout we replaced.

    +(back?" · "+back+" cable(s) still fold back — a cycle, not a placement bug":" · every cable points forward");

function clearVerdicts(){

/* Build the badges once, staggered, so the pass reads as a pass. */

    d.style.left=c.x+"px"; d.style.top=c.y+"px";

/* mark one of a node's OWN ports (a ring's DOM holds its children's ports too) */
function markPort(nd,dir,port,cls){

const PICKLIST_CACHE=new Map();
async function livePicklist(spec){
  if(PICKLIST_CACHE.has(spec)) return PICKLIST_CACHE.get(spec);

  if(!type||!path) return [];
  const p=(async()=>{
    const res=await api("POST","/api/lcnc/run",{type,inputs:{}});
    if(!res||!res.outputs) return [];
    let cur=res.outputs;
    for(const seg of path.split(".")){
      if(cur==null) return [];
      if(seg.endsWith("[]")){
        const key=seg.slice(0,-2);
        cur=(key?cur[key]:cur);

        cur={__list:cur.__list.map(x=>x&&x[seg]).filter(v=>v!=null)};
      } else cur=cur[seg];

  const parts=parts0.slice();

    for(const el of document.querySelectorAll('.port[data-port="'+CSS.escape(pr.i.port)+'"]')){

function startWireDrag(n,dir,name,e){
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.classList.add("drag"); wiresSvg.appendChild(path);
  dragWire={n,dir,name,path};
  // the canvas states the options: while this wire is in hand, kind-equal
  // ports stay lit, everything else dims, mateless nodes fade
  document.body.classList.add("wiring");
  const srcKind=nodeKindOf(n,dir,name);
  // scope path — the ring-containment rule the drop check uses. Hoisted so the
  // SHAKE below prunes by the same law the landing does, instead of lighting a
  // spot that would be refused the moment you let go.
  const scopePathOf=m=>{const q=[];let sc=m._parentScope;while(sc){q.unshift(sc.id);sc=sc._parentScope;}return q;};
  const srcScope=scopePathOf(n);
  const cands=[];
  const blocked=[];   // kind-compatible, ring-refused — shown, not hidden
  for(const nd of G.nodes){
    if(!nd.el) continue;
    let any=false;
    for(const pe of nd.el.querySelectorAll(".port")){
      if(pe.closest(".node")!==nd.el) continue;
      const kindOk=nd.id!==n.id&&pe.dataset.dir!==dir&&kindsCompatible(srcKind,nodeKindOf(nd,pe.dataset.dir,pe.dataset.port));
      // Containment is a SEPARATE question from kind. A port that matches on
      // kind but sits in a ring this cable cannot reach used to be pruned
      // silently — indistinguishable from a port that does not match at all.
      // That is the scope impedance: the types line up and the frames do not,
      // and nothing on screen said so. It is shown REFUSED now, not hidden.
      let scopeOk=true;
      if(kindOk){
        const dp=scopePathOf(nd), sp=srcScope;
        const a=dir==="out"?sp:dp, b=dir==="out"?dp:sp;
        scopeOk=a.length<=b.length&&a.every((v,ix)=>b[ix]===v);
      }
      const ok=kindOk&&scopeOk;
      pe.classList.toggle("mateable",ok);
      pe.classList.toggle("scopeblock",kindOk&&!scopeOk);
      if(ok){ any=true; cands.push({nd,pe,port:pe.dataset.port,pdir:pe.dataset.dir}); }
      else if(kindOk){ any=true; blocked.push({nd,pe,port:pe.dataset.port,pdir:pe.dataset.dir}); }
    }
    nd.el.classList.toggle("nomate",!any&&nd.id!==n.id);
  }

  // you would GET — which node, around which ring, crossing what. Ports do not
  // move during a drag, so this geometry is computed once.

  if(anchor) for(const c of cands){
    const b=portCenter(c.nd.id,c.pdir,c.port); if(!b) continue;
    const g=document.createElementNS("http://www.w3.org/2000/svg","path");
    g.classList.add("cand");
    g.setAttribute("d", dir==="out"?bez(anchor,b):bez(b,anchor));
    const kc=KINDCOLOR[portClass(c.nd.type,c.pdir,c.port)]||KINDCOLOR[portClass(n.type,dir,name)];
    if(kc) g.style.stroke=kc;
    wiresSvg.insertBefore(g,wiresSvg.firstChild); // behind the live cable
    ghosts.push({...c,g,b});
  }
  // …and the refused ones, so the impedance is visible rather than absent.
  if(anchor) for(const c of blocked){
    const b=portCenter(c.nd.id,c.pdir,c.port); if(!b) continue;
    const g=document.createElementNS("http://www.w3.org/2000/svg","path");
    g.classList.add("cand","blocked");
    g.setAttribute("d", dir==="out"?bez(anchor,b):bez(b,anchor));

    " out of ring — data flows lateral or inward; thread through scope.in/scope.out";

  // meaning left. Say so now, and land it on release without a menu.

  }

    const w=world.getBoundingClientRect();
    const m={x:(ev.clientX-w.left)/view.z,y:(ev.clientY-w.top)/view.z};
    const a=portCenter(n.id,dir,name)||m;

    path.remove();
    document.body.classList.remove("wiring");
    document.querySelectorAll(".port.mateable").forEach(x=>x.classList.remove("mateable"));
    document.querySelectorAll(".port.scopeblock").forEach(x=>x.classList.remove("scopeblock"));
    document.querySelectorAll(".port.mate-only").forEach(x=>x.classList.remove("mate-only"));
    document.querySelectorAll(".node.nomate").forEach(x=>x.classList.remove("nomate"));
    for(const gh of ghosts) gh.g.remove();
    const tgt=document.elementFromPoint(ev.clientX,ev.clientY);
    // Highlighting HIGHLIGHTS. A lone legal mate is worth pointing at, and
    // nothing more — landing it because the drag happened to be unambiguous
    // merges on a gesture that never asked to merge. Auto-merge lives in the
    // treeshake, where it is the thing you pressed.
    if(tgt&&tgt.classList.contains("port")&&tgt.dataset.dir!==dir){
      // the port's OWNING node is its nearest .node ancestor — a ring's DOM
      // contains its children, so .contains() would hand every child wire
      // to the enclosing scope
      const owner=tgt.closest(".node");
      const tn=owner&&G.nodes.find(x=>x.el===owner);
      if(tn&&tn.id!==n.id){
        const pathOf=m=>{const q=[];let s=m._parentScope;while(s){q.unshift(s.id);s=s._parentScope;}return q;};
        const src=dir==="out"?n:tn, dst=dir==="out"?tn:n;
        const from = dir==="out" ? [n.id,name] : [tn.id,tgt.dataset.port];
        const to   = dir==="out" ? [tn.id,tgt.dataset.port] : [n.id,name];
        // ENFORCED kinds: the daemon's mating rule is exact equality — a
        // mismatched wire is refused here, not discovered at run time.

        const sp=pathOf(src), dp=pathOf(dst);

        const lateralOrInward=sp.length<=dp.length&&sp.every((v,ix)=>dp[ix]===v);
        if(!kindsCompatible(sk,dk)){
          $("#status").textContent="kind mismatch: "+src.type+"."+from[1]+" emits "+(sk||"untyped")+", "+dst.type+"."+to[1]+" wants "+(dk||"untyped");
        } else if(!lateralOrInward){
          $("#status").textContent="ring boundary: data flows lateral or inward — yields leave through scope.out";
        } else {
          G.wires=G.wires.filter(w=>!(w.to[0]===to[0]&&w.to[1]===to[1])); // one wire per input
          G.wires.push({from,to}); save();
        }
      }
    } else {
      // released on EMPTY context: the MATE POPUP, both directions.
      // Forward (from an output): daemon-offered, evidence-ordered
      // continuations. BACKCHAIN (from an input): every type whose output
      // kind equals this input's kind. Picking one lands the node AT the
      // drop point — inside a ring if that's where you dropped — wired.

  };

}
/* the mate popup: release a wire on empty canvas and the daemon offers the

function applyView(){ world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`; }
viewport.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  viewport.classList.add("panning");
  const sx=e.clientX,sy=e.clientY,ox=view.x,oy=view.y;
  const mv=ev=>{ view.x=ox+ev.clientX-sx; view.y=oy+ev.clientY-sy; applyView(); };
  const up=()=>{ viewport.classList.remove("panning"); removeEventListener("pointermove",mv); removeEventListener("pointerup",up); save(); };

/* A camera move is not a document mutation.
   save() serializes the WHOLE document twice (once for history, once for
   localStorage), JSON.parses it twice more for the shape check, and writes
   localStorage synchronously. Calling that per wheel event — a trackpad emits
   50-100 a second — is what made zooming stutter, and it buried every real edit
   under a hundred camera frames in the undo stack. Pan already saves only on
   pointerup; the wheel was the outlier. */
let camSaveT=0;
function saveCameraSoon(){ clearTimeout(camSaveT); camSaveT=setTimeout(save,250); }

/* deltaMode: 0=pixel, 1=line, 2=page. Firefox sends lines. */
function wheelPixels(e,rect){ const k=e.deltaMode===1?16:e.deltaMode===2?rect.height:1; return {dx:e.deltaX*k,dy:e.deltaY*k}; }

viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  // Anchor on the viewport's own box rather than a hardcoded 40px bar height,
  // so the point under the cursor stays under the cursor.
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const {dy}=wheelPixels(e,r);
  // Wheel zooms, as it always has. Only the STEP changed: proportional to the
  // gesture instead of a fixed 1.1 per event, because a trackpad sends many
  // small deltas where a mouse sends few large ones — a constant step made the
  // trackpad rocket and the wheel crawl.
  const f=Math.exp(-dy*0.0025);
  const nz=Math.min(2.5,Math.max(.08,view.z*f));   // .08 so a spread-out board fits
  view.x=px-(px-view.x)*(nz/view.z);
  view.y=py-(py-view.y)*(nz/view.z);
  view.z=nz; applyView(); saveCameraSoon();
},{passive:false});

/* Frame every top-level node. The rings have had a fit gesture all along
   (double-click the D-tab); the top-level canvas had none, so a board wider
   than the window could only be found by dragging blind. */
function fitToContent(){
  const tops=G.nodes.filter(n=>!n._parentScope&&n.el);
  if(!tops.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of tops){
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x+(n.el.offsetWidth||190)); y1=Math.max(y1,n.y+(n.el.offsetHeight||90));
  }
  const r=viewport.getBoundingClientRect(), pad=48;
  const z=Math.min(2.5,Math.max(.08,Math.min((r.width-pad*2)/Math.max(1,x1-x0),(r.height-pad*2)/Math.max(1,y1-y0))));
  view.z=z;
  view.x=(r.width-(x1-x0)*z)/2-x0*z;
  view.y=(r.height-(y1-y0)*z)/2-y0*z;
  applyView(); saveCameraSoon();
}

const PROJECT_MARKERS=/^(settings\.gradle(\.kts)?|build\.gradle(\.kts)?|package\.json|Cargo\.toml|CMakeLists\.txt|Makefile|pom\.xml|go\.mod|pyproject\.toml|setup\.py|mix\.exs|Package\.swift|.*\.xcodeproj\/.*)$/;

async function panelsWalkEntries(dirEntry,prefix){
  const out=[]; const reader=dirEntry.createReader();
  while(true){
    const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
    if(!batch.length)break;
    for(const en of batch){
      if(en.isFile){ out.push({rel:prefix+en.name,file:await new Promise((res,rej)=>en.file(res,rej))}); }
      else if(en.isDirectory){ if(SKIP_DIRS.has(en.name))continue; out.push(...await panelsWalkEntries(en,prefix+en.name+"/")); }
    }

/* ── execution ─────────────────────────────────────────────────────────── */
function inputsOf(id){ return G.wires.filter(w=>w.to[0]===id); }
function topo(){
  // ring children run in the daemon's frame (the scope runner posts the
  // ring); the client walk sequences top-level nodes only
  const order=[],mark={};
  const visit=id=>{
    if(mark[id]==="t")return; if(mark[id]==="p")throw "cycle at "+id;
    const nd=G.nodes.find(n=>n.id===id);
    if(!nd||nd._parentScope){ mark[id]="t"; return; }
    mark[id]="p";
    for(const w of inputsOf(id)) visit(w.from[0]);
    // a ring depends on every outside source feeding its interior (the
    // inward warm-base wires) — those must run before the ring posts
    if(nd.children&&nd.children.length){
      const dIds=new Set(); (function wk(m){ for(const c of (m.children||[])){ dIds.add(c.id); wk(c); } })(nd);
      for(const w of G.wires) if(dIds.has(w.to[0])&&!dIds.has(w.from[0])) visit(w.from[0]);
    }
    mark[id]="t"; order.push(id);
  };
  G.nodes.forEach(n=>{ if(!n._parentScope) visit(n.id); });
  return order.map(id=>G.nodes.find(n=>n.id===id));
}
async function runNode(n,cache){
  const t=CONTRACTS[n.type]; const R=RUNNERS[n.type];
  if(!t||!R) return undefined;
  const inputs={};
  for(const w of inputsOf(n.id)){
    if(!wireKindOk(w)) continue;                      // a mismatched cable feeds nothing
    const src=cache[w.from[0]];
    if(src===undefined) return undefined;             // upstream not run
    inputs[w.to[1]]=src[w.from[1]];
  }
  for(const name of t.ins){ if(!name.endsWith("?") && inputs[name]===undefined) return undefined; }
  n.el.classList.remove("ok","err"); n.el.classList.add("running");
  try{
    const out=await R.run(n,inputs);
    n.el.classList.remove("running"); n.el.classList.add("ok");
    n._lastOut=out; // memo for partial runs: closure runs seed upstream values from here
    if(R.render) R.render(n,out);
    else if(!t.sink && n.type!=="display" && out!==undefined && Object.keys(out).length) setResult(n,out);
    return out;
  }catch(e){
    n.el.classList.remove("running"); n.el.classList.add("err");
    setResult(n,"ERROR: "+(e&&e.message||e));
    return undefined;
  }
}
async function runAll(fromId){
  $("#status").textContent="running…";
  wiresSvg.querySelectorAll("path.live").forEach(w=>w.classList.add("flow"));
  let order;
  try{ order=topo(); }catch(e){ $("#status").textContent=String(e); return; }
  if(fromId){                                          // restrict to downstream closure of fromId
    const keep=new Set([fromId]); let grew=true;
    while(grew){ grew=false; for(const w of G.wires) if(keep.has(w.from[0])&&!keep.has(w.to[0])){keep.add(w.to[0]);grew=true;} }
    order=order.filter(n=>keep.has(n.id));
  }
  const cache={};
  if(fromId){
    // Partial runs start from an interior node (a board drop, an SSE event) whose
    // own required inputs live OUTSIDE the closure — seed them from the last full
    // run's memo or the closure's first node silently refuses to run.
    for(const n of G.nodes) if(!order.includes(n) && n._lastOut!==undefined) cache[n.id]=n._lastOut;
  }
  for(const n of order){ const out=await runNode(n,cache); if(out!==undefined) cache[n.id]=out; }
  wiresSvg.querySelectorAll("path.flow").forEach(w=>w.classList.remove("flow"));
  resolveTopLevelOverlaps(); // result trees grow nodes — keep them clear of each other
  redraw();

}
/* arm sources (timers + SSE). Called by ▶ run AND after every load path —
   a preset loaded from the gallery must tick, not sit inert until ▶. */
function armSources(){
  for(const n of G.nodes){
    if(n._parentScope) continue; // no client timers/SSE inside a ring — the daemon owns the frame
    if(CONTRACTS[n.type]&&CONTRACTS[n.type].source&&n.type==="timer"&&!n._timer){
      const s=Math.max(1,+p(n,"seconds")||5);
      n._timer=setInterval(()=>runAll(n.id), s*1000);
    }
    if(n.type==="graal.events"&&!n._es){
      // pointcut-driven dataflow: every matching graal event re-fires this node's downstream
      n._es=new EventSource("/api/graal/events");
      n._es.onmessage=(ev)=>{
        const f=p(n,"filter");
        if(f && !(ev.data||"").includes(f)) return;
        try{ n._lastEvent=JSON.parse(ev.data); }catch(_){ n._lastEvent=ev.data; }
        runAll(n.id);
      };
    }
    if(n.type==="vm.events"&&!n._es){
      // sub-VM lifecycle dataflow: spawn/eval/revoke events re-fire this node's downstream
      n._es=new EventSource("/api/vm/events");
      n._es.onmessage=(ev)=>{
        try{ var d=JSON.parse(ev.data); }catch(_){ return; }
        if(p(n,"vmId") && d.vmId!==p(n,"vmId")) return;
        if(p(n,"kind") && d.kind!==p(n,"kind")) return;
        n._lastEvent=d;
        runAll(n.id);
      };
    }
  }
}
