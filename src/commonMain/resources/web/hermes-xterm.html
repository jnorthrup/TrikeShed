<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes xterm-256color · TrikeShed</title>
<style>
:root{--bg:#090b10;--panel:#11151e;--line:#293142;--ink:#d8dce6;--dim:#7d879a;--amber:#f2a011;--green:#3ddc84;--red:#ff5964;--cyan:#3fd0ff}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{color:var(--amber)} .badge{border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--dim)}
button{font:inherit;color:var(--ink);background:#171d28;border:1px solid var(--line);border-radius:3px;padding:4px 8px;cursor:pointer} button:hover{border-color:var(--amber);color:var(--amber)}
main{min-height:0;display:grid;grid-template-columns:minmax(500px,1fr) 310px;gap:1px;background:var(--line)}
#terminalPanel{min-width:0;background:#050607;display:flex;flex-direction:column}
#screenWrap{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;align-items:flex-start;justify-content:center}
/* Focus lives here, not on #screen: IME commits, mobile keyboards and dictation only reach a form
   control. It must stay in the layout (not display:none) or it cannot hold focus. */
#kbd{position:absolute;width:1px;height:1px;padding:0;border:0;outline:none;resize:none;opacity:0;left:-9999px;overflow:hidden}
#screen{outline:none;background:#000;color:#d8dce6;padding:5px 6px;box-shadow:0 0 0 1px #222,0 0 28px rgba(63,208,255,.05);font:14px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none;user-select:text;cursor:text}
.termrow{height:1.15em;white-space:pre}.cell{display:inline-block;width:.61em;height:1.15em;overflow:visible;vertical-align:top}
/* The cursor is the panel's own cursor, not a DOM caret: the cell carries no inline colour so these win. */
.cursor{outline:1px solid var(--amber);background:rgba(242,160,17,.28)}
#screen.focused .cursor{background:var(--amber);color:#07090d;animation:caret 1.06s steps(1) infinite}
@keyframes caret{50%{background:rgba(242,160,17,.2);color:var(--ink)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.15}}
#rails{min-height:0;background:var(--panel);display:grid;grid-template-rows:auto 1fr 1fr}
#rails h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0;padding:8px 10px;border-bottom:1px solid var(--line)}
.rail{overflow:auto;border-bottom:1px solid var(--line);padding:5px}.sig{padding:5px 7px;margin:3px 0;border-left:3px solid var(--dim);background:#161b25;font-size:10px;word-break:break-word}.sig.manual{border-color:var(--amber)}.sig.causal{border-color:var(--cyan)}.sig.failed{border-color:var(--red)}.sig .id{color:var(--dim)}.sig .cause{color:var(--cyan)}
.ok{color:var(--green)}.bad{color:var(--red)}
#hint{margin-left:auto;color:var(--dim);font-size:11px}
@media(max-width:900px){main{grid-template-columns:1fr}#rails{display:none}}
@media(prefers-reduced-motion:reduce){.blink,#screen.focused .cursor{animation:none}}
</style>
</head>
<body data-app-page="hermes">
<header><b>HERMES · XTERM-256COLOR</b><span id="state" class="badge">closed</span><span id="geometry" class="badge">–</span><span id="revision" class="badge">rev 0</span><button id="open">boot GraalPy sleeve</button><span id="hint">click the screen and type · ↑ history · Ctrl-C cancel · Ctrl-L clear</span><a href="/graal" style="color:var(--dim);margin-left:12px">Graal console ↗</a></header>
<main>
  <section id="terminalPanel"><div id="screenWrap"><div id="screen" role="application" aria-label="Hermes xterm-256color terminal"></div><textarea id="kbd" aria-label="terminal input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div></section>
  <aside id="rails"><h2>manual ↔ causal LCNC patch panel</h2><div id="manualRail" class="rail"></div><div id="causalRail" class="rail"></div></aside>
</main>

</body>
</html>
