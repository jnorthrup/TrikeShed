<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="/application-nav.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfers · trikeshed</title>
<link rel="icon" href="/icons/forge-icon.svg">
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3a;--ink:#e3e7ef;--dim:#8b94a7;--gold:#f0c870}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:14px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line)}
header b{color:var(--gold);font-size:16px;letter-spacing:.02em}
header span{color:var(--dim)}
header kbd{background:#1b2230;border:1px solid var(--line);border-radius:3px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--ink)}
#transfers-status{margin-left:auto;font:12px ui-monospace,monospace}
main{flex:1;display:flex;min-height:0}
#transfers{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#transfers:active{cursor:grabbing}
#transfers-panel{width:420px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto}
#transfers-panel h2{margin:0 0 8px;font-size:17px;overflow-wrap:anywhere}
#transfers-panel h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px}
#transfers-panel dl{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;font-size:12px}
#transfers-panel dt{color:var(--dim)} #transfers-panel dd{margin:0;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
#transfers-panel ol{padding-left:18px;margin:0;font:11.5px/1.5 ui-monospace,monospace;color:#b8c2d0;overflow-wrap:anywhere}
#transfers-panel a{color:#7fc8bd}
.dim{color:var(--dim)} .err{color:#ee8884}
a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body data-app-page="transfers">
<header><b>Transfers</b><span>every transport's transfers on the SUMO ground · wheel/drag to move · right- or shift-drag, <kbd>Q</kbd><kbd>E</kbd> turn, <kbd>PgUp</kbd><kbd>PgDn</kbd> tilt · <kbd>↑</kbd> parent (<kbd>1</kbd>–<kbd>9</kbd> pick one) <kbd>↓</kbd> child <kbd>←</kbd><kbd>→</kbd> siblings <kbd>⌫</kbd> back · <kbd>H</kbd> or <kbd>Home</kbd> home of the class in hand, <kbd>0</kbd> the whole ground, <kbd>R</kbd> raised or flat · a flick glides</span><span id="transfers-status">connecting…</span></header>
<main><div id="transfers" aria-label="Transfers on the SUMO ground"></div><aside id="transfers-panel" aria-live="polite"></aside></main>
<script src="/kotlin/spacegraph/spacegraph.js" defer></script>
</body>
</html>
