<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi · Forge</title>
<link rel="stylesheet" href="/application-nav.css">
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#151c24;--line:#34414e;--ink:#edf3f5;--dim:#b2c1c5;--accent:#71d6c6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:30px 24px 60px}h1{margin:0;font-size:30px}h2{font-size:17px;margin:0 0 12px}p{color:var(--dim)}
.intro{margin:6px 0 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px}label{display:grid;gap:5px;color:var(--dim)}select,input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:6px;background:#0d141b;color:var(--ink);padding:9px}
select{min-width:220px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:#21635a;border-color:#39877b}.status{min-height:1.5em}.transcript{white-space:pre-wrap;overflow-wrap:anywhere;min-height:100px;max-height:45vh;overflow:auto}textarea{display:block;width:100%;resize:vertical;min-height:100px;margin:8px 0}a{color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#terminalPanel{background:#050607;border:1px solid #293142;min-width:0;overflow:auto;padding:10px;font:14px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace}
#pi-screen-wrap{max-height:min(60vh,35rem);overflow:auto;overflow-anchor:none}
#screen{min-width:max-content;background:#000;color:#d8dce6;padding:5px 6px;user-select:text}.termrow{height:1.15em;white-space:pre}.cell{display:inline-block;width:.61em;height:1.15em;vertical-align:top}.cursor{outline:1px solid #f2a011;background:rgba(242,160,17,.28)}
#pi-scrollback{min-width:max-content;background:#000;color:#d8dce6;padding:5px 6px 0;user-select:text}.pi-history-run{display:inline-block;height:1.15em;vertical-align:top;white-space:pre}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}
#pi-transcript{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body data-app-page="pi">
<main>
  <h1>Pi</h1>
  <p class="intro">A separate Pi agent session, using the models and tools made available by this Forge host.</p>
  <p id="pi-project" hidden></p>
  <section class="card" aria-label="Pi session">
    <h2>Session</h2>
    <p id="pi-status" class="status" role="status" aria-live="polite">Enter the Pi access token, then refresh models.</p>
    <a id="pi-context" hidden>Open breadcrumbs in ModelMux</a>
    <div class="controls">
      <label>Pi access token <input id="pi-token" type="password" autocomplete="off" aria-label="Pi access token"></label>
      <label>Model <select id="pi-model" aria-label="Pi model" disabled><option value="">Choose a model</option></select></label>
      <label>Breadcrumb context <input id="pi-breadcrumb" type="text" maxlength="128" placeholder="New context"></label>
      <button id="pi-refresh" type="button">Refresh models</button>
      <button id="pi-start" class="primary" type="button" disabled>Start Pi session</button>
      <button id="pi-close" type="button" disabled>Close session</button>
    </div>
  </section>
  <section class="card" aria-label="Pi conversation">
    <h2>Pi console</h2>
    <div id="pi-transcript" class="transcript" aria-live="polite">No messages yet.</div>
    <div id="terminalPanel"><div id="pi-screen-wrap" role="log" aria-label="Pi xterm console" tabindex="0"><div id="pi-scrollback"></div><div id="screen"></div></div><span id="geometry" hidden></span><span id="revision" hidden></span><form id="pi-form"><label for="pi-prompt">&gt; Message</label><textarea id="pi-prompt" placeholder="Write a message for this session"></textarea><button id="pi-send" class="primary" type="submit" disabled>Send to Pi</button></form></div>
  </section>
</main>
<script src="/kotlin/pages/pages.js" defer></script>
</body>
</html>
