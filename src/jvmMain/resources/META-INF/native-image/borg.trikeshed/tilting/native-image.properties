# GraalVM native-image: FFM downcall shapes of Lz4Ffm/LzoFfm (reachability-metadata.json, from the tracing agent);
# the unbound handles are created at build time so the image calls them directly.
Args = --enable-native-access=ALL-UNNAMED \
       --initialize-at-build-time=borg.trikeshed.tilting.lz4.Lz4Downcall,borg.trikeshed.tilting.lzo.LzoDowncall
