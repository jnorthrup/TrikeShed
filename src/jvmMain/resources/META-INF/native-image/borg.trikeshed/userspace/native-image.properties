# GraalVM native-image: the libc call shapes of JvmFileSyscalls/JvmSocketSyscalls (LibcDowncall). The unbound handles
# are created at build time, so the image calls each downcall stub directly instead of interpreting the handle.
# reachability-metadata.json registers the shapes (tracing agent on macOS arm64 and Linux x86_64, merged).
Args = --enable-native-access=ALL-UNNAMED \
       --initialize-at-build-time=borg.trikeshed.userspace.LibcDowncall
