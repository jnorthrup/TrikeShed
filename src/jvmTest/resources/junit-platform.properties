# Per-test budgets, so one wedged test costs seconds instead of the whole run.
#
# Why this file exists: OroborosDaemonBackoffTest blocked forever in
# BufferedReader.readLine() waiting for an "[OROBOROS] backoff=" line that the
# daemon stopped printing when the Jules flywheel was deleted (4790932e5). The
# run had no per-test bound, so a dead assertion read as a 13-minute build.
# A hang is now a named failure at the deadline, not an unbounded trajectory.
#
# SEPARATE_THREAD is the point. The JUnit default, SAME_THREAD, only measures
# the duration and reports afterwards -- it never preempts, so it is worth
# nothing against a test that never returns. SEPARATE_THREAD lets the platform
# abandon the wait and move on. It is safe here because nothing under
# src/jvmTest reads thread-affine state across lifecycle and test methods (the
# one ThreadLocal in main, dht/id/NUID.kt, is a per-thread id generator).
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD

# 120s is a ceiling on hangs, not a performance target. Tests that genuinely
# need longer declare it themselves with @Timeout, which overrides this; the
# longest such declaration in the suite today is 240s. A test that trips this
# without an annotation is asking to be given an explicit budget.
junit.jupiter.execution.timeout.testable.method.default = 120 s
junit.jupiter.execution.timeout.lifecycle.method.default = 60 s

# Never let a timeout fire while someone is sitting on a breakpoint.
junit.jupiter.execution.timeout.mode = disabled_on_debug
