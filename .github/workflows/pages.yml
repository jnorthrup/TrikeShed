name: Deploy docs to Pages

# The legacy Pages queue stopped serving this repo (builds list frozen at
# July, deployments at September, queued requests never start), so the site
# builds and deploys through Actions instead. jekyll-build-pages is the same
# builder the legacy pipeline ran; docs/ is the site, master is the branch.
on:
  push:
    branches: ["master"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No LFS: the films stay pointers on Pages; docs/video/index.md
        # supplies them through media.githubusercontent.com instead.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
