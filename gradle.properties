kotlin.mpp.stability.nowarn=true
#Some Kotlin/Native targets cannot be built on this linux_x64 machine and are disabled:
#    * In project ':'
#        * target 'native' (can be built with one of the hosts: macos_x64, macos_arm64)
#To hide this message, add 'kotlin.native.ignoreDisabledTargets=false' to the Gradle properties.
kotlin.native.ignoreDisabledTargets=false
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.enableCInteropCommonization.nowarn=true
# In-process Kotlin compilation shares this heap; keep one authoritative setting.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m
kotlin.daemon.jvmargs=-Xmx6g -Xms1g -XX:TieredStopAtLevel=1
kotlin.compiler.execution.strategy=in-process
# Do not pin a machine-local SDKMAN Java path here; let CI and local environments
# provide JAVA_HOME / toolchains explicitly so GitHub Actions runners remain valid.
org.gradle.caching=true
org.gradle.parallel=true
kotlin.incremental=true

# Forge PWA publish stages for generateForgePages: jvm (baker, mandatory), js, wasm. Override with -PforgePagesStages=jvm,js
forgePagesStages=jvm
